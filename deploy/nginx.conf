# Nginx 反向代理配置 — A股量化分析助手
# 部署路径：/etc/nginx/sites-available/astock
# 启用：ln -s /etc/nginx/sites-available/astock /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # 上线后改为你的域名，如 astock.yourdomain.com

    client_max_body_size 10m;

    # 访问日志
    access_log /var/log/nginx/astock_access.log;
    error_log  /var/log/nginx/astock_error.log;

    # gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如有需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_read_timeout 120s;
    }

    # 静态文件缓存（CSS/JS/图片 7天）
    location ~* \.(css|js|png|jpg|gif|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

