<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日复盘 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=15" />
<script src="/lib/echarts.js"></script>
<style>
.review-chart { width:100%; height:380px; }
.date-picker { padding:6px 12px; border-radius:6px; border:1px solid var(--color-border); background:var(--color-card); color:var(--color-text); font-size:0.9rem; }
.status-dot-rev { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.status-dot-rev.ready { background:#22c55e; box-shadow:0 0 4px rgba(34,197,94,0.5); }
.status-dot-rev.expired { background:#f59e0b; box-shadow:0 0 4px rgba(245,158,11,0.5); }
.status-dot-rev.empty { background:#6b7280; }
.status-dot-rev.latest { background:#00d4aa; box-shadow:0 0 6px rgba(0,212,170,0.6); }
.review-toolbar { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.review-toolbar .btn-dl { padding:6px 14px; font-size:0.8rem; border-radius:6px; border:1px solid var(--color-primary); background:transparent; color:var(--color-primary); cursor:pointer; transition:all 0.15s; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
.review-toolbar .btn-dl:hover { background:var(--color-primary); color:#fff; }
.review-toolbar .btn-dl:disabled { opacity:0.4; cursor:not-allowed; border-color:var(--color-border); color:var(--color-text-muted); }
.expired-banner { text-align:center; padding:40px 20px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; }
.expired-banner .expired-icon { font-size:2rem; margin-bottom:12px; }
.expired-banner .expired-msg { color:var(--color-text-muted); margin-bottom:16px; font-size:0.9rem; }
.review-header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:8px; }

/* 8-block layout */
.review-blocks { display:flex; flex-direction:column; gap:16px; }

/* AI summary banner */
.ai-summary-banner {
  background:linear-gradient(135deg, rgba(22,119,255,0.08), rgba(14,165,233,0.06));
  border:1px solid var(--color-primary); border-radius:10px;
  padding:20px 24px; position:relative;
}
.ai-summary-banner .ai-label {
  position:absolute; top:-10px; left:20px;
  background:var(--color-primary); color:#fff;
  padding:2px 10px; border-radius:4px;
  font-size:0.7rem; font-weight:600;
}
.ai-summary-banner .ai-text { font-size:1rem; line-height:1.8; color:var(--color-text); margin-top:4px; }
.ai-summary-banner .ai-meta { font-size:0.7rem; color:var(--color-text-muted); margin-top:8px; }

/* Mini stats row */
.mini-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:8px 0 16px; }
.mini-stat { text-align:center; padding:12px 8px; background:var(--color-card); border-radius:8px; border:1px solid var(--color-border); }
.mini-stat .ms-val { font-size:1.15rem; font-weight:700; }
.mini-stat .ms-label { font-size:0.7rem; color:var(--color-text-muted); margin-top:4px; }

/* Two-column tables */
.two-col-tables { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:768px) { .two-col-tables { grid-template-columns:1fr; } }

/* Concept tags */
.concept-tags { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.concept-tag {
  padding:3px 10px; border-radius:4px; font-size:0.75rem; font-weight:500;
  background:rgba(22,119,255,0.1); color:var(--color-primary);
  border:1px solid rgba(22,119,255,0.2);
}

/* Warning items */
.warning-item {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-radius:6px; background:rgba(220,68,70,0.06);
  border-left:3px solid var(--color-danger); margin-bottom:6px;
}
.warning-item .wi-name { font-weight:600; flex:1; }
.warning-item .wi-type { font-size:0.72rem; color:var(--color-danger); }

/* Sentiment badge */
.sentiment-badge {
  display:inline-block; padding:4px 12px; border-radius:4px;
  font-size:0.78rem; font-weight:600;
}
.sentiment-badge.bullish { background:rgba(220,68,70,0.12); color:var(--color-danger); }
.sentiment-badge.bearish { background:rgba(73,170,25,0.12); color:var(--color-success); }
.sentiment-badge.neutral { background:rgba(131,146,165,0.12); color:var(--color-text-muted); }

/* Block note */
.block-note { font-size:0.7rem; color:var(--color-text-muted); margin-top:8px; font-style:italic; }


@media (max-width:768px) {
  .review-toolbar { width:100%; }
  .review-header-row { flex-direction:column; }
  .ai-summary-banner { padding:16px; }
  .ai-summary-banner .ai-text { font-size:0.9rem; }
}
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">AI 量化每日复盘</h2>
  <p class="page-desc">8维度数据驱动 · 大盘温度 · 聪明钱 · 涨停深度 · 业绩预警 · 异常信号 · 策略池表现</p>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
    <span style="font-size:0.85rem;color:var(--color-text-muted)">选择日期：</span>
    <select id="dateSelect" class="date-picker" onchange="loadReview(this.value)"></select>
    <span id="reviewCount" style="font-size:0.82rem;color:var(--color-text-muted)">共 0 份复盘报告</span>
    <span style="font-size:0.72rem;color:var(--color-text-muted);margin-left:auto;" id="dateStatus"></span>
  </div>

  <!-- 复盘报告（散户版） -->
  <div class="card" style="margin-bottom:16px;">
    <div class="card-header">📊 复盘报告 <span style="font-size:0.72rem;color:var(--color-text-muted);font-weight:400;">大盘 · 打板 · 选股 · 主线 · 风险</span></div>
    <div class="card-body">
      <div id="ruleReviewPanel"><p class="state-loading">加载中...</p></div>
    </div>
  </div>

  <!-- 行业轮动（五阶段 + 周期演变） -->
  <div class="card" style="margin-bottom:16px;">
    <div class="card-header">🔄 行业轮动 <span style="font-size:0.72rem;color:var(--color-text-muted);font-weight:400;">五阶段分布 + 周期演变</span></div>
    <div class="card-body">
      <div id="sectorRotationChart" style="width:100%;"></div>
    </div>
  </div>

  <div id="reviewDetail" style="display:none;"></div>
  <div id="reviewChart" class="review-chart" style="display:none;"></div>
</main>
<script src="/js/app.js?v=18"></script>
<script>
var allDates = [];
var allReviews = {};
var allStatuses = {};
var _emptyDates = {};
var _currentDate = null;

// ── 7步纯规则复盘 ──
function loadRuleReview() {
  API.get('/review/rule').then(function(r) {
    var data = r.data || {};
    var content = data.content || {};
    if (!content.emotion) return;
    renderRuleReview(content);
  }).catch(function() {});
}

function renderRuleReview(c) {
  var plan = c.plan || {};
  var market = c.market || {};
  var e = c.emotion || {};
  var l = c.ladder || {};
  var s = c.sectors || {};
  var loss = c.loss || {};
  var poolToday = c.pool_today || {};
  var poolPerf = c.pool_perf || {};

  var verdictColor = plan.verdict === '可参与' ? '#ef4444' : plan.verdict === '规避' ? '#26a69a' : '#888';
  var cycleColor = plan.cycle === '上升期' ? '#ef4444' : plan.cycle === '退潮期' ? '#26a69a' : '#f59e0b';
  var tempEmoji = market.temp === '热' ? '🔥' : market.temp === '暖' ? '😊' : market.temp === '冷' ? '🥶' : '😐';

  // 顶部：一句话结论
  var html = '<div style="padding:14px;border-radius:8px;background:var(--color-bg-secondary);margin-bottom:16px;">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;">' +
      '<div style="font-size:1.5rem;font-weight:800;color:' + verdictColor + ';">' + escHtml(plan.verdict || '--') + '</div>' +
      '<span style="font-size:0.85rem;font-weight:700;color:' + cycleColor + ';">' + escHtml(plan.cycle || '') + '</span>' +
      '<span style="font-size:0.85rem;">' + tempEmoji + ' 大盘' + escHtml(market.temp || '') + '</span>' +
    '</div>' +
    '<div style="font-size:1.05rem;font-weight:700;color:var(--color-text);margin-bottom:6px;">操作：' + escHtml(plan.style || '--') + '</div>' +
    '<div style="color:var(--color-text-muted);font-size:0.78rem;line-height:1.6;">' + escHtml((plan.actions || []).join(' · ')) + '</div>' +
    (plan.avoid && plan.avoid.length ? '<div style="margin-top:6px;color:#e5484d;font-size:0.78rem;">⚠️ ' + escHtml(plan.avoid.join('；')) + '</div>' : '') +
    '</div>';

  // ① 大盘分析
  var idxNames = { '000001.SH': '上证', '399001.SZ': '深证', '399006.SZ': '创业板', '000688.SH': '科创50' };
  var idxHtml = Object.keys(idxNames).map(function(k) {
    var v = market.indices ? market.indices[k] : null;
    return '<span style="margin-right:14px;">' + idxNames[k] + ' <b class="' + (v > 0 ? 'up' : v < 0 ? 'down' : 'flat') + '">' + (v != null ? (v > 0 ? '+' : '') + v + '%' : '--') + '</b></span>';
  }).join('');
  html += '<div style="margin-bottom:16px;padding:12px;border-radius:8px;border:1px solid var(--color-border);">' +
    '<div style="font-weight:600;margin-bottom:8px;">① 大盘</div>' +
    '<div style="margin-bottom:8px;">' + idxHtml + '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<span style="color:#888;font-size:0.75rem;min-width:52px;">涨跌家数</span>' +
      '<div style="flex:1;height:10px;border-radius:5px;overflow:hidden;display:flex;"><div style="width:' + (market.up_ratio || 0) + '%;background:#ef4444;"></div><div style="flex:1;background:#26a69a;"></div></div>' +
      '<span style="font-size:0.75rem;color:#888;">' + market.up + '涨 ' + market.down + '跌</span>' +
    '</div>' +
    '</div>';

  // ② 打板机会
  html += '<div style="margin-bottom:16px;padding:12px;border-radius:8px;border:1px solid var(--color-border);">' +
    '<div style="font-weight:600;margin-bottom:8px;">② 打板机会</div>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;">' +
      '<div><b class="up" style="font-size:1.05rem;">' + e.up + '</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">涨停</span></div>' +
      '<div><b class="down" style="font-size:1.05rem;">' + e.down + '</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">跌停</span></div>' +
      '<div><b style="font-size:1.05rem;">' + e.zha + '</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">炸板</span></div>' +
      '<div><b style="font-size:1.05rem;">' + e.zha_rate + '%</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">炸板率</span></div>' +
      (e.avg_premium != null ? '<div><b class="' + (e.avg_premium > 0 ? 'up' : 'down') + '" style="font-size:1.05rem;">' + (e.avg_premium > 0 ? '+' : '') + e.avg_premium + '%</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">昨日溢价</span></div>' : '') +
      '<div><b style="font-size:1.05rem;">' + (l.max_board || 0) + '板</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">最高板</span></div>' +
      (l.j1 != null ? '<div><b style="font-size:1.05rem;">' + l.j1 + '%</b><span style="color:#888;font-size:0.75rem;margin-left:2px;">1进2</span></div>' : '') +
    '</div>' +
    '<div style="font-weight:700;color:' + cycleColor + ';font-size:0.92rem;">打板建议：' + escHtml(plan.style || '--') + '</div>' +
    '</div>';

  // ③ 选股机会
  var perfHtml = (poolPerf.pools || []).map(function(p) {
    return '<span style="margin-right:14px;">' + escHtml(p.name) + ' <b class="' + (p.avg_pct > 0 ? 'up' : p.avg_pct < 0 ? 'down' : 'flat') + '">' + (p.avg_pct != null ? (p.avg_pct > 0 ? '+' : '') + p.avg_pct + '%' : '--') + '</b></span>';
  }).join('');
  var poolHtml = (poolToday.pools || []).map(function(p) {
    var items = (p.items || []).slice(0, 8).map(function(i) { return i.name; }).join('、');
    return '<div style="margin-bottom:5px;"><b style="font-size:0.82rem;">' + escHtml(p.name) + '</b><span style="font-size:0.78rem;color:var(--color-text);"> ' + escHtml(items) + (p.items && p.items.length > 8 ? '…' : '') + '</span></div>';
  }).join('');
  html += '<div style="margin-bottom:16px;padding:12px;border-radius:8px;border:1px solid var(--color-border);">' +
    '<div style="font-weight:600;margin-bottom:8px;">③ 选股机会（因子选股池）</div>' +
    (perfHtml ? '<div style="margin-bottom:8px;font-size:0.85rem;">昨日选出表现：' + perfHtml + '</div>' : '') +
    '<div style="font-size:0.78rem;color:#888;margin-bottom:4px;">今日名单：</div>' + poolHtml +
    '</div>';

  // ④ 主线方向
  var strong = (s.strong_sectors || []).slice(0, 6);
  var strongHtml = strong.map(function(x) {
    return '<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:10px;background:var(--color-bg-secondary);border:1px solid var(--color-border);font-size:0.75rem;">' + escHtml(x[0]) + ' <b>' + x[1] + '只</b></span>';
  }).join('');
  html += '<div style="margin-bottom:16px;padding:12px;border-radius:8px;border:1px solid var(--color-border);">' +
    '<div style="font-weight:600;margin-bottom:8px;">④ 主线方向（涨停最多的板块）</div>' + (strongHtml || '<span style="color:#888;font-size:0.8rem;">无强势板块</span>') +
    '</div>';

  // ⑤ 别碰什么
  var avoidItems = [];
  if (loss.big_face && loss.big_face.length) avoidItems.push('大面股：' + loss.big_face.slice(0, 3).map(function(x) { return x[0]; }).join('、'));
  if (plan.avoid && plan.avoid.length) avoidItems = avoidItems.concat(plan.avoid);
  html += '<div style="padding:12px;border-radius:8px;border:1px solid #e5484d;">' +
    '<div style="font-weight:600;margin-bottom:6px;color:#e5484d;">⑤ 别碰什么</div>' +
    (avoidItems.length ? avoidItems.map(function(a) { return '<div style="font-size:0.8rem;color:#e5484d;margin-bottom:3px;">⚠️ ' + escHtml(a) + '</div>'; }).join('') : '<div style="font-size:0.8rem;color:#888;">无明显风险</div>') +
    '</div>';

  document.getElementById('ruleReviewPanel').innerHTML = html;
}

// ── 因子选股池表现（昨日选出 → 今日涨幅）──
function loadFactorPoolPerformance() {
  API.get('/review/pool-performance').then(function(r) {
    var data = r.data || {};
    var pools = data.pools || [];
    var panel = document.getElementById('poolPerfPanel');
    if (!panel || !pools.length) return;
    var range = '';
    if (data.prev_date && data.date) {
      range = data.prev_date.slice(0, 4) + '-' + data.prev_date.slice(4, 6) + '-' + data.prev_date.slice(6, 8) + ' 选出 → ' +
        data.date.slice(0, 4) + '-' + data.date.slice(4, 6) + '-' + data.date.slice(6, 8);
    }
    var h = '<div class="card"><div class="card-header">📈 因子选股池表现 <span style="font-size:0.72rem;color:var(--color-text-muted);font-weight:400;">' + escHtml(range) + ' 平均涨幅</span></div><div class="card-body">';
    pools.forEach(function(p) {
      var cls = p.avg_pct > 0 ? 'up' : p.avg_pct < 0 ? 'down' : 'flat';
      var barW = Math.min(Math.abs(p.avg_pct || 0) * 10, 100);
      var barColor = (p.avg_pct >= 0) ? 'linear-gradient(90deg,#f59e0b,#ef4444)' : 'linear-gradient(90deg,#26a69a,#0f9d58)';
      h += '<div style="margin-bottom:12px;">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">' +
          '<span style="font-weight:600;min-width:64px;">' + escHtml(p.name) + '</span>' +
          '<b class="' + cls + '" style="font-size:1.15rem;min-width:76px;">' + (p.avg_pct != null ? (p.avg_pct > 0 ? '+' : '') + p.avg_pct + '%' : '--') + '</b>' +
          '<span style="color:var(--color-text-muted);font-size:0.75rem;">' + p.up_count + '涨 ' + p.down_count + '跌 / ' + p.total + '只</span>' +
        '</div>' +
        '<div style="height:8px;background:var(--color-bg-secondary);border-radius:4px;overflow:hidden;">' +
          '<div style="height:100%;width:' + barW + '%;background:' + barColor + ';border-radius:4px;"></div>' +
        '</div>' +
      '</div>';
    });
    h += '</div></div>';
    panel.innerHTML = h;
  }).catch(function() {});
}

// ── 行业轮动（申万二级）──
function loadSectorRotation() {
  API.get('/sector-rotation/rotation?days=20').then(function(r) {
    var data = r.data || {};
    if (!data.sectors || !data.sectors.length || !data.heatmap || !data.heatmap.length) return;
    renderSectorRotationChart(data);
  }).catch(function() {});
}

function renderSectorRotationChart(data) {
  var container = document.getElementById('sectorRotationChart');
  if (!container) return;
  var height = Math.max(500, data.sectors.length * 6 + 80);
  container.innerHTML = '<div id="stageHeatmap" style="width:100%;height:' + height + 'px;"></div>';

  var chartDom = document.getElementById('stageHeatmap');
  if (!chartDom) return;
  var chart = echarts.init(chartDom);
  var dates = data.dates.map(function(d) { return String(d).slice(4, 6) + '/' + String(d).slice(6, 8); });
  var sectorNames = data.sectors.map(function(s) { return s.name; });
  var stageNames = ['启动', '主升', '见顶', '下行', '震荡'];

  var option = {
    tooltip: {
      position: 'top',
      formatter: function(p) {
        var s = data.sectors[p.value[1]];
        return '<b>' + s.name + '</b><br/>' + data.dates[p.value[0]] + '：' + stageNames[p.value[2]] +
          '<br/>当前：' + s.phase + '（近20日 ' + (s.cN > 0 ? '+' : '') + s.cN + '%，近5日 ' + (s.c5 > 0 ? '+' : '') + s.c5 + '%）';
      }
    },
    grid: { left: 92, right: 30, top: 10, bottom: 66 },
    xAxis: { type: 'category', data: dates, splitArea: { show: true }, axisLabel: { fontSize: 9, color: '#888' } },
    yAxis: { type: 'category', data: sectorNames, splitArea: { show: true }, axisLabel: { fontSize: 9, color: '#ccc' } },
    visualMap: {
      type: 'piecewise',
      pieces: [
        { value: 1, label: '主升', color: '#e53935' },
        { value: 2, label: '见顶', color: '#9e9e9e' },
        { value: 0, label: '启动', color: '#f59e0b' },
        { value: 3, label: '下行', color: '#26a69a' },
        { value: 4, label: '震荡', color: '#5c8ae6' },
      ],
      orient: 'horizontal', left: 'center', bottom: 0,
      textStyle: { fontSize: 10, color: '#888' }
    },
    series: [{
      type: 'heatmap',
      data: data.stage_heatmap,
      label: { show: false },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } }
    }]
  };
  chart.setOption(option);
  window.addEventListener('resize', function() { chart.resize(); });
}

(function() {
  loadSectorRotation();
  loadRuleReview();
  API.get('/review/dates').then(function(r) {
    allDates = (r.data && r.data.dates) ? r.data.dates : [];
    if (!allDates.length) {
      document.getElementById('reviewDetail').innerHTML = '<p class="state-empty">暂无交易数据,请先运行数据同步</p>';
      buildDateSelect();
      return;
    }
    preloadStatuses(function() {
      buildDateSelect();
      autoGenerateLatest();
    });
  }).catch(function() {
    document.getElementById('reviewDetail').innerHTML = '<p class="state-empty">获取交易日列表失败</p>';
  });
})();

function autoGenerateLatest() {
  var latestDate = allDates[0];
  if (!latestDate) return;
  var st = allStatuses[latestDate] || 'not_generated';
  if (st === 'ready' || st === 'latest') {
    loadReview(latestDate);
  } else {
    generateReport(latestDate, true);
  }
}

function preloadStatuses(cb) {
  var pending = allDates.length, done = 0;
  function check() { done++; if (done >= pending) cb(); }
  allDates.forEach(function(td) {
    API.get('/review/status/' + td).then(function(r) {
      allStatuses[td] = r.data.status || 'not_generated';
      if (r.data.is_latest) allStatuses[td] = 'latest';
      check();
    }).catch(function() { allStatuses[td] = 'not_generated'; check(); });
  });
}

function buildDateSelect() {
  var sel = document.getElementById('dateSelect');
  sel.innerHTML = '';
  allDates.forEach(function(td) {
    if (_emptyDates[td]) return;
    var opt = document.createElement('option');
    opt.value = td;
    var label = td.substring(0,4) + '-' + td.substring(4,6) + '-' + td.substring(6,8);
    var st = allStatuses[td] || 'not_generated';
    if (st === 'latest') label = '⭐ ' + label;
    opt.textContent = label;
    if (td === _currentDate) opt.selected = true;
    sel.appendChild(opt);
  });
  document.getElementById('reviewCount').textContent = '共 ' + sel.options.length + ' 份复盘报告';
}

function statusDot(st) {
  if (st === 'latest') return '<span class="status-dot-rev latest" title="最近交易日"></span>';
  if (st === 'ready') return '<span class="status-dot-rev ready" title="已生成"></span>';
  if (st === 'expired') return '<span class="status-dot-rev expired" title="已过期"></span>';
  return '<span class="status-dot-rev empty" title="未生成"></span>';
}

function updateDateStatus(td) {
  var st = allStatuses[td] || 'not_generated';
  var labels = { latest: '⭐ 最近交易日', ready: '已生成', expired: '已过期', not_generated: '未生成' };
  document.getElementById('dateStatus').innerHTML = statusDot(st) + ' ' + (labels[st] || '未知');
}

function loadReview(td) {
  document.getElementById('reviewDetail').innerHTML = '<p class="state-loading">加载中...</p>';
  document.getElementById('reviewChart').style.display = 'none';
  _currentDate = td;
  updateDateStatus(td);

  function _loaded(data) {
    if (!data || !data.content) { _emptyDates[td] = true; skipToNext(td); return; }
    var c = data.content;
    var hasData = c.temperature && c.temperature.total;
    if (!hasData && !c.ai_summary) { _emptyDates[td] = true; skipToNext(td); return; }
    allReviews[td] = data;
    allStatuses[td] = data.is_latest ? 'latest' : 'ready';
    buildDateSelect();
    updateDateStatus(td);
    renderReview(td, data);
  }

  if (allReviews[td] !== undefined && allReviews[td] !== null) { _loaded(allReviews[td]); return; }
  API.get('/review/daily?date=' + td).then(function(r) {
    var d = r.data;
    if (d.status === 'not_generated') { allReviews[td] = null; showGeneratePrompt(td); buildDateSelect(); updateDateStatus(td); return; }
    _loaded(d);
  }).catch(function() { allReviews[td] = null; _emptyDates[td] = true; skipToNext(td); });
}

function skipToNext(td) {
  var idx = allDates.indexOf(td);
  if (idx >= 0 && idx < allDates.length - 1) _skipTarget = allDates[idx + 1];
  buildDateSelect();
  var sel = document.getElementById('dateSelect');
  if (sel.options.length > 0) loadReview(sel.value);
  else document.getElementById('reviewDetail').innerHTML = '<p class="state-empty">暂无复盘数据</p>';
}

function showGeneratePrompt(td) {
  var dtLabel = td.substring(0,4) + '-' + td.substring(4,6) + '-' + td.substring(6,8);
  var html = '<div class="expired-banner"><div class="expired-icon">📅</div>';
  html += '<div style="font-size:1rem;font-weight:600;margin-bottom:6px;">' + dtLabel + ' 复盘报告</div>';
  html += '<div class="expired-msg">该日期尚未生成复盘报告</div>';
  html += '<button class="load-more-btn" onclick="event.stopPropagation();generateReport(\'' + td + '\')" style="font-size:0.85rem;">生成 AI 复盘报告</button>';
  html += '</div>';
  document.getElementById('reviewDetail').innerHTML = html;
  document.getElementById('reviewChart').style.display = 'none';
}

function generateReport(td, autoMode) {
  _currentDate = td;
  document.getElementById('reviewDetail').innerHTML = '<div class="gen-progress"><div style="font-size:0.9rem;color:var(--color-text-muted);">' + (autoMode ? '自动生成最近交易日复盘...' : '正在生成 AI 量化复盘报告...') + '</div></div>';
  document.getElementById('reviewChart').style.display = 'none';

  API.post('/review/generate', { date: td }).then(function(r) {
    var d = r.data;
    if (d.content) {
      allReviews[td] = d;
      allStatuses[td] = d.is_latest ? 'latest' : 'ready';
      buildDateSelect();
      updateDateStatus(td);
      renderReview(td, d);
    } else {
      document.getElementById('reviewDetail').innerHTML = '<p class="state-empty">该日期暂无交易数据</p>';
    }
  }).catch(function(e) {
    document.getElementById('reviewDetail').innerHTML = '<p class="state-error">生成失败: ' + (e.message || '服务器错误') + ' <button class="load-more-btn" onclick="generateReport(\'' + td + '\')" style="font-size:0.78rem;margin-left:8px;">重试</button></p>';
  });
}

// --- 8-Block Render ---

function renderReview(td, data) {
  var c = data.content || {};
  var dtLabel = td.substring(0,4) + '-' + td.substring(4,6) + '-' + td.substring(6,8);

  // Header
  var headerHtml = '<div class="review-header-row"><div style="font-weight:600;font-size:0.95rem;">📊 ' + dtLabel + ' 量化复盘</div>';
  headerHtml += '<div class="review-toolbar">';
  if (data.generated_at) {
    headerHtml += '<span style="font-size:0.72rem;color:var(--color-text-muted);">生成于 ' + data.generated_at.substring(0,10) + '</span>';
  }
  headerHtml += '<a class="btn-dl" href="/api/v1/review/download?date=' + td + '&fmt=md" download>📥 MD</a>';
  headerHtml += '<a class="btn-dl" href="/api/v1/review/download?date=' + td + '&fmt=pdf" download style="margin-left:4px;">📄 PDF</a>';
  headerHtml += '</div></div>';

  var html = '<div class="review-blocks">' + headerHtml;
  html += buildMarketTemperature(c.temperature);
  html += buildSmartMoney(c.smart_money);
  html += '<div id="poolPerfPanel"></div>';
  html += '</div>';

  document.getElementById('reviewDetail').innerHTML = html;
  loadFactorPoolPerformance();

  // Draw pie chart if temperature data exists
  if (c.temperature && c.temperature.total) {
    document.getElementById('reviewChart').style.display = 'block';
    drawPieChart(c.temperature, c.temperature.total);
  } else {
    document.getElementById('reviewChart').style.display = 'none';
  }
}

// -- Block 1: AI Summary Banner --

function buildAISummary(ai) {
  if (!ai || !ai.text) return '';
  var modelTag = ai.model ? ' via ' + ai.model : '';
  return '<div class="ai-summary-banner">' +
    '<div class="ai-label">🤖 AI 总结' + modelTag + '</div>' +
    '<div class="ai-text">' + escHtml(ai.text) + '</div>' +
    (ai.note ? '<div class="block-note">' + escHtml(ai.note) + '</div>' : '') +

// -- Block 2: Market Temperature --

function buildMarketTemperature(t) {
  if (!t || t.error || !t.total) {
    return '<div class="card"><div class="card-header">🌡️ 大盘温度</div><div class="card-body"><p class="state-empty">' + (t && t.error ? escHtml(t.error) : '暂无数据') + '</p></div></div>';
  }

  var sentimentClass = t.up_ratio >= 60 ? 'bullish' : (t.up_ratio >= 40 ? 'neutral' : 'bearish');
  var amountArrow = t.amount_change_pct > 0 ? '↑' : '↓';

  var h = '<div class="card"><div class="card-header">🌡️ 大盘温度 <span class="sentiment-badge ' + sentimentClass + '" style="margin-left:8px;">' + escHtml(t.width_label || '') + '</span></div><div class="card-body">';

  // Stat grid
  h += '<div class="stat-grid" style="margin-bottom:16px;">';
  h += '<div class="stat-card"><div class="stat-label">全市场</div><div class="stat-value" style="font-size:1.2rem;">' + t.total + ' 只</div></div>';
  h += '<div class="stat-card"><div class="stat-label">涨 / 平 / 跌</div><div class="stat-value" style="font-size:1rem;">' + t.up_count + ' / ' + (t.flat_count || 0) + ' / ' + t.down_count + '</div></div>';
  h += '<div class="stat-card"><div class="stat-label">涨停 / 跌停</div><div class="stat-value" style="font-size:1rem;"><span style="color:var(--color-danger)">' + t.limit_up + '</span> / <span style="color:var(--color-success)">' + t.limit_down + '</span></div></div>';
  h += '<div class="stat-card"><div class="stat-label">平均涨跌幅</div><div class="stat-value ' + (t.avg_pct > 0 ? 'risk-low' : 'risk-high') + '">' + (t.avg_pct > 0 ? '+' : '') + t.avg_pct + '%</div></div>';
  h += '</div>';

  // Mini stats: turnover, amount, sentiment
  h += '<div class="mini-stats">';
  h += '<div class="mini-stat"><div class="ms-val">' + t.avg_turnover + '%</div><div class="ms-label">均换手率</div></div>';
  h += '<div class="mini-stat"><div class="ms-val ' + (t.amount_change_pct > 0 ? 'risk-low' : 'risk-high') + '">' + t.total_amount_yi + '亿 <span style="font-size:0.7rem;">' + amountArrow + Math.abs(t.amount_change_pct) + '%</span></div><div class="ms-label">成交额</div></div>';
  h += '<div class="mini-stat"><div class="ms-val">' + (t.sentiment_score || '-') + '</div><div class="ms-label">情绪分</div></div>';
  h += '</div>';

  // Two-col tables: top gainers + top losers
  h += '<div class="two-col-tables">';
  h += _buildTopTable('涨幅 TOP5', t.top_gainers, 'pct', true);
  h += _buildTopTable('跌幅 TOP5', t.top_losers, 'pct', false);
  h += '</div>';

  // Top sectors
  if (t.top_sectors && t.top_sectors.length) {
    h += '<div style="margin-top:12px;"><strong style="font-size:0.85rem;">行业涨幅 TOP5</strong></div>';
    h += '<div class="concept-tags">';
    t.top_sectors.forEach(function(s) {
      h += '<span class="concept-tag">' + escHtml(s.name) + ' ' + (s.avg_pct > 0 ? '+' : '') + s.avg_pct + '%</span>';
    });
    h += '</div>';
  }

  h += '<div class="block-note">' + escHtml(t.summary || '') + '</div>';
  h += '</div></div>';
  return h;
}

// -- Block 3: Smart Money + Northbound Chart --

function buildSmartMoney(sm) {
  if (!sm || sm.error) {
    return '<div class="card"><div class="card-header">💰 聪明钱共识</div><div class="card-body"><p class="state-empty">' + (sm && sm.error ? escHtml(sm.error) : '暂无数据') + '</p></div></div>';
  }

  var h = '<div class="card"><div class="card-header">💰 聪明钱共识 <span class="sentiment-badge ' + (nbVal >= 0 ? 'bullish' : 'bearish') + '" style="margin-left:8px;">' + escHtml(sm.smart_money_label || '') + '</span></div><div class="card-body">';

  h += '<div class="mini-stats">';
  h += '<div class="mini-stat"><div class="ms-val ' + nbClass + '">' + nbArrow + Math.abs(nbVal).toFixed(1) + '亿</div><div class="ms-label">北向净流入</div></div>';
  h += '</div>';

  // 北向5日柱状图
  if (sm.northbound_5d_trend && sm.northbound_5d_trend.length) {
    h += '<div id="northbound5dChart" style="width:100%;height:140px;margin-bottom:12px;"></div>';
    setTimeout(function() {
      var chartDom = document.getElementById('northbound5dChart');
      if (!chartDom) return;
      var chart = echarts.init(chartDom);
      var dates = sm.northbound_5d_trend.map(function(d) { return d.date ? d.date.substring(4,6) + '/' + d.date.substring(6,8) : ''; });
      var values = sm.northbound_5d_trend.map(function(d) { return d.value || 0; });
      chart.setOption({
        grid: { top: 12, right: 12, bottom: 20, left: 40 },
        xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10, color: '#888' }, axisLine: { lineStyle: { color: '#333' } } },
        yAxis: { type: 'value', axisLabel: { fontSize: 10, color: '#888' }, splitLine: { lineStyle: { color: '#222' } } },
        series: [{
          type: 'line', data: values,
          smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: { width: 2, color: '#ef5350' },
          itemStyle: { color: function(p) { return p.value >= 0 ? '#ef5350' : '#26a69a'; } },
          areaStyle: { opacity: 0.12, color: '#ef5350' },
          label: { show: true, position: 'top', fontSize: 9, color: '#aaa', formatter: function(p) { return (p.value > 0 ? '+' : '') + p.value.toFixed(1); } }
        }]
      });
    }, 50);
  }

  // 北向活跃板块占比饼图
  if (sm.northbound_sectors && sm.northbound_sectors.length) {
    h += '<div style="font-size:0.78rem;color:var(--color-text-muted);margin-bottom:4px;">北向活跃板块占比 (hsgt_top10成交额)</div>';
    h += '<div id="northboundSectorChart" style="width:100%;height:200px;"></div>';
    setTimeout(function() {
      var chartDom = document.getElementById('northboundSectorChart');
      if (!chartDom) return;
      var chart = echarts.init(chartDom);
      var pieData = sm.northbound_sectors.map(function(s) { return { name: s.name, value: s.value }; });
      chart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c}亿 ({d}%)' },
        legend: { orient: 'horizontal', bottom: 0, textStyle: { fontSize: 9, color: '#888' } },
        series: [{
          type: 'pie', radius: ['35%', '65%'], center: ['50%', '45%'],
          data: pieData,
          label: { fontSize: 9, color: '#999', formatter: '{b}\n{d}%' },
          itemStyle: { borderRadius: 2, borderColor: '#1a1a2e', borderWidth: 2 }
        }]
      });

  h += '</div></div>';
  return h;

// -- Block 5: Anomaly Signals --
function buildAnomalySignals(an) {
  if (!an || an.error) {
    return '<div class="card"><div class="card-header">⚡ 异常信号</div><div class="card-body"><p class="state-empty">' + (an && an.error ? escHtml(an.error) : '暂无数据') + '</p></div></div>';
  }

  var h = '<div class="card"><div class="card-header">⚡ 异常信号 <span style="font-size:0.75rem;color:var(--color-text-muted);">(高换手/量异常/急涨急跌/缩量)</span></div><div class="card-body">';

  // Tabs: high_turnover / volume_surge / volume_shrink / rapid_rise / rapid_drop
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">';
  h += '<button onclick="switchAnomalyTab(\'tab-high-turnover\')" class="btn btn-sm btn-outline anomaly-tab-btn" data-tab="tab-high-turnover">高换手(' + (an.high_turnover ? an.high_turnover.length : 0) + ')</button>';
  h += '<button onclick="switchAnomalyTab(\'tab-volume-surge\')" class="btn btn-sm btn-outline anomaly-tab-btn" data-tab="tab-volume-surge">放量(' + (an.volume_surge ? an.volume_surge.length : 0) + ')</button>';
  h += '<button onclick="switchAnomalyTab(\'tab-rapid-rise\')" class="btn btn-sm btn-outline anomaly-tab-btn" data-tab="tab-rapid-rise">急涨(' + (an.rapid_rise_5d ? an.rapid_rise_5d.length : 0) + ')</button>';
  h += '<button onclick="switchAnomalyTab(\'tab-rapid-drop\')" class="btn btn-sm btn-outline anomaly-tab-btn" data-tab="tab-rapid-drop">急跌(' + (an.rapid_drop_5d ? an.rapid_drop_5d.length : 0) + ')</button>';
  h += '<button onclick="switchAnomalyTab(\'tab-volume-shrink\')" class="btn btn-sm btn-outline anomaly-tab-btn" data-tab="tab-volume-shrink">缩量(' + (an.volume_shrink ? an.volume_shrink.length : 0) + ')</button>';
  h += '</div>';

  h += '<div id="tab-high-turnover" class="anomaly-tab-content">' + _anomalyTable(an.high_turnover, ['名称', '换手率', '涨跌'], ['name', 'turnover', 'pct_chg'], ['', '%', '%']) + '</div>';
  h += '<div id="tab-volume-surge" class="anomaly-tab-content" style="display:none;">' + _anomalyTableVol(an.volume_surge, '量比') + '</div>';
  h += '<div id="tab-rapid-rise" class="anomaly-tab-content" style="display:none;">' + _anomalyTableChg(an.rapid_rise_5d, '5日涨幅') + '</div>';
  h += '<div id="tab-rapid-drop" class="anomaly-tab-content" style="display:none;">' + _anomalyTableChg(an.rapid_drop_5d, '5日跌幅') + '</div>';
  h += '<div id="tab-volume-shrink" class="anomaly-tab-content" style="display:none;">' + _anomalyTableVol(an.volume_shrink, '量比') + '</div>';

  // Default: show first non-empty
  h += '<scr' + 'ipt>setTimeout(function(){ var btns=document.querySelectorAll(".anomaly-tab-btn"); var hasShown=false; for(var i=0;i<btns.length;i++){ var tab=btns[i].getAttribute("data-tab"); var el=document.getElementById(tab); if(el && el.textContent.trim() && !hasShown){ switchAnomalyTab(tab); hasShown=true; } } }, 10);<\/scr' + 'ipt>';

  h += '</div></div>';
  return h;
}

function switchAnomalyTab(tabId) {
  document.querySelectorAll('.anomaly-tab-content').forEach(function(el) { el.style.display = 'none'; });
  document.querySelectorAll('.anomaly-tab-btn').forEach(function(b) { b.classList.remove('btn-primary'); b.classList.add('btn-outline'); });
  var el = document.getElementById(tabId);
  if (el) el.style.display = 'block';
  var btn = document.querySelector('[data-tab="' + tabId + '"]');
  if (btn) { btn.classList.remove('btn-outline'); btn.classList.add('btn-primary'); }
}

function _anomalyTable(items, headers, keys, suffixes) {
  if (!items || !items.length) return '<p style="color:var(--color-text-muted);font-size:0.85rem;">无数据</p>';
  var h = '<table class="data-table" style="width:100%;"><thead><tr>';
  headers.forEach(function(hd) { h += '<th>' + hd + '</th>'; });
  h += '</tr></thead><tbody>';
  items.forEach(function(item) {
    h += '<tr>';
    keys.forEach(function(k, i) {
      var v = item[k] !== undefined ? item[k] : '-';
      if (typeof v === 'number') v = v.toFixed ? (v > 0 && i > 0 ? '+' : '') + v.toFixed(2) : v;
      h += '<td>' + v + (suffixes[i] && v !== '-' ? suffixes[i] : '') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

function _anomalyTableVol(items, label) {
  if (!items || !items.length) return '<p style="color:var(--color-text-muted);font-size:0.85rem;">无数据</p>';
  var h = '<table class="data-table" style="width:100%;"><thead><tr><th>名称</th><th>成交量(手)</th><th>' + label + '</th><th>涨跌</th></tr></thead><tbody>';
  items.forEach(function(a) {
    h += '<tr><td>' + escHtml(a.name) + '</td><td>' + (a.volume || '-').toLocaleString() + '</td><td>' + (a.vol_ratio || '-') + '</td><td style="color:' + (a.pct_chg > 0 ? 'var(--color-danger)' : 'var(--color-success)') + '">' + (a.pct_chg > 0 ? '+' : '') + a.pct_chg + '%</td></tr>';
  });
  h += '</tbody></table>';
  return h;
}

function _anomalyTableChg(items, label) {
  if (!items || !items.length) return '<p style="color:var(--color-text-muted);font-size:0.85rem;">无数据</p>';
  var isRise = label.indexOf('涨') >= 0;
  var h = '<table class="data-table" style="width:100%;"><thead><tr><th>名称</th><th>今日涨跌</th><th>' + label + '</th></tr></thead><tbody>';
  items.forEach(function(a) {
    var clr = isRise ? 'var(--color-danger)' : 'var(--color-success)';
    h += '<tr><td>' + escHtml(a.name) + '</td><td style="color:' + (a.pct_chg_today > 0 ? 'var(--color-danger)' : 'var(--color-success)') + '">' + (a.pct_chg_today > 0 ? '+' : '') + a.pct_chg_today + '%</td><td style="color:' + clr + '">' + (a.chg_5d > 0 ? '+' : '') + a.chg_5d + '%</td></tr>';
  });
  h += '</tbody></table>';
  return h;
}

// -- Block 6: Strategy Pools --

function buildStrategyPools(sp) {
  if (!sp || sp.error) {
    return '<div class="card"><div class="card-header">🎯 策略池表现</div><div class="card-body"><p class="state-empty">' + (sp && sp.error ? escHtml(sp.error) : '暂无选股数据') + '</p></div></div>';
  }

  var pools = sp.pools || {};
  var poolKeys = Object.keys(pools);
  if (poolKeys.length === 0) {
    return '<div class="card"><div class="card-header">🎯 策略池表现</div><div class="card-body"><p class="state-empty">' + (sp.note || '暂无选股数据') + '</p></div></div>';
  }

  // Pool name friendly labels
  var nameMap = {
    'factor_short': '⚡ 短线选股', 'factor_long': '📈 长线选股'
  };

  var h = '<div class="card"><div class="card-header">🎯 策略池表现 <span style="font-size:0.75rem;color:var(--color-text-muted);">(' + (sp.calc_date || '') + ' 收盘选股)</span></div><div class="card-body">';

  // Sort by avg_pct desc
  var sorted = poolKeys.sort(function(a, b) { return (pools[b].avg_pct || 0) - (pools[a].avg_pct || 0); });

  h += '<div class="mini-stats">';
  sorted.forEach(function(k) {
    var p = pools[k];
    var clr = p.avg_pct > 0 ? 'color:var(--color-danger)' : (p.avg_pct < 0 ? 'color:var(--color-success)' : '');
    h += '<div class="mini-stat"><div class="ms-val" style="' + clr + '">' + (p.avg_pct > 0 ? '+' : '') + (p.avg_pct || 0).toFixed(2) + '%</div><div class="ms-label">' + (nameMap[k] || k) + '</div></div>';
  });
  h += '</div>';

  // Top 3 per pool
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:12px;">';
  sorted.forEach(function(k) {
    var p = pools[k];
    if (!p.top3 || !p.top3.length) return;
    h += '<div style="padding:8px 12px;background:var(--color-card);border-radius:6px;border:1px solid var(--color-border);">';
    h += '<div style="font-weight:600;font-size:0.8rem;margin-bottom:4px;">' + (nameMap[k] || k) + '</div>';
    p.top3.forEach(function(s, i) {
      h += '<div style="display:flex;justify-content:space-between;font-size:0.78rem;padding:2px 0;">';
      h += '<span>' + (i + 1) + '. ' + escHtml(s.name || s.code || '') + '</span>';
      var pct = s.pct_chg;
      if (typeof pct === 'number') {
        h += '<span style="color:' + (pct > 0 ? 'var(--color-danger)' : 'var(--color-success)') + '">' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%</span>';
      } else {
        h += '<span style="color:var(--color-text-muted)">' + escHtml(String(pct)) + '</span>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  h += '</div>';

  if (sp.note) h += '<div class="block-note">' + escHtml(sp.note) + '</div>';
  h += '</div></div>';
  return h;
}

// -- Helpers --

function _buildTopTable(title, items, pctKey, isGainer) {
  var h = '<div style="background:var(--color-card);border-radius:8px;border:1px solid var(--color-border);padding:12px;">';
  h += '<div style="font-weight:600;font-size:0.85rem;margin-bottom:8px;">' + title + '</div>';
  if (!items || !items.length) {
    h += '<p style="color:var(--color-text-muted);font-size:0.8rem;">无数据</p>';
  } else {
    h += '<table style="width:100%;font-size:0.82rem;"><tbody>';
    items.forEach(function(s, i) {
      var clr = isGainer ? 'var(--color-danger)' : 'var(--color-success)';
      h += '<tr><td style="padding:3px 0;">' + (i + 1) + '. ' + escHtml(s.name) + '</td>';
      h += '<td style="text-align:right;color:' + clr + ';font-weight:600;">' + (s[pctKey] > 0 ? '+' : '') + s[pctKey] + '%</td>';
      h += '<td style="text-align:right;color:var(--color-text-muted);font-size:0.75rem;">' + escHtml(s.industry || '') + '</td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';
  return h;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// -- Pie Chart --

function drawPieChart(t, total) {
  var el = document.getElementById('reviewChart');
  if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    title: { text: '涨跌分布 (' + total + '只)', left: 'center', textStyle: { fontSize: 14, color: 'rgba(255,255,255,0.88)' } },
    tooltip: { trigger: 'item' },
    series: [{
      type: 'pie', radius: ['40%', '70%'], center: ['50%', '55%'],
      data: [
        { value: t.up_count, name: '上涨(' + t.up_count + '只)', itemStyle: { color: '#ef232a' } },
        { value: t.flat_count || 0, name: '平盘(' + (t.flat_count || 0) + '只)', itemStyle: { color: '#8392A5' } },
        { value: t.down_count, name: '下跌(' + t.down_count + '只)', itemStyle: { color: '#14b143' } },
      ],
      label: { color: 'rgba(255,255,255,0.88)', fontSize: 11 },
    }]
  });
  window.addEventListener('resize', function() { chart.resize(); });
}

</script>
