<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stockwin 因子库 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=15" />
<style>
.factor-cards { display: flex; flex-wrap: wrap; gap: 12px; }
.factor-card { flex: 1 1 calc(33% - 8px); min-width: 260px; padding: 14px 14px 12px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.factor-card:hover { border-color: var(--color-primary); }
.factor-card.active { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-translucent, rgba(72,120,255,.15)); }
.fc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.fc-code { font-weight: 700; color: var(--color-primary); font-size: 0.9rem; white-space: nowrap; }
.fc-name { font-weight: 600; font-size: 0.95rem; }
.dim-tag { font-size: 0.68rem; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.dim-价格 { background: rgba(72,120,255,.15); color: #4878ff; }
.dim-量 { background: rgba(245,158,11,.15); color: #f59e0b; }
.dim-基本面 { background: rgba(20,177,67,.15); color: #14b143; }
.dim-量择时, .dim-量\(择时\) { background: rgba(239,35,42,.15); color: #ef232a; }
.fc-ic { font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 6px; }
.fc-env { font-size: 0.72rem; color: var(--color-text-muted); line-height: 1.5; }
.fc-desc { font-size: 0.78rem; color: var(--color-text); margin-top: 6px; line-height: 1.5; }
.state-empty { color: var(--color-text-muted); font-size: 0.85rem; padding: 8px 0; }
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">Stockwin 因子库</h2>
  <p class="page-desc">经 10 年数据验证的有效因子 · 配置驱动 · 实时更新</p>

  <!-- 因子库展示 -->
  <div class="card"><div class="card-header">📚 因子库 <span id="factorTotal" style="font-size:0.75rem;color:var(--color-text-muted);font-weight:400;"></span></div><div class="card-body">
    <div id="factorLib"><div class="state-empty">加载因子库...</div></div>
  </div></div>
</main>
<script src="/lib/echarts.js"></script>
<script src="/js/app.js?v=18"></script>
<script>
(function() {
  if (!Gate.checkPage(2)) return;
  if (!Session.isVip()) Gate.showUpgradeBanner();
})();

var _factors = {};  // key -> meta

function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// 加载因子库
function loadFactorLib() {
  API.get('/backtest/strategies').then(function(r) {
    if (!r.data || !r.data.categories) { document.getElementById('factorLib').innerHTML = '<div class="state-empty">因子库加载失败</div>'; return; }
    document.getElementById('factorTotal').textContent = '共 ' + r.data.total + ' 个';
    renderFactorLib(r.data.categories);
  }).catch(function() {
    document.getElementById('factorLib').innerHTML = '<div class="state-empty">因子库加载失败</div>';
  });
}

function dimClass(dim) {
  if (dim.indexOf('价格') >= 0) return 'dim-价格';
  if (dim.indexOf('量') >= 0) return 'dim-量';
  if (dim.indexOf('基本面') >= 0) return 'dim-基本面';
  return 'dim-量';
}

function renderFactorLib(categories) {
  var html = '';
  Object.keys(categories).forEach(function(dim) {
    html += '<div style="font-size:0.72rem;color:var(--color-text-muted);margin:10px 0 6px;padding-left:4px;">' + escHtml(dim) + '</div>';
    html += '<div class="factor-cards">';
    categories[dim].forEach(function(f) {
      _factors[f.key] = f;
      var icTxt = f.ic !== null && f.ic !== undefined ? ('IC ' + (f.ic>0?'+':'') + f.ic) : '';
      html += '<div class="factor-card" id="fc-' + f.key + '">';
      html += '<div class="fc-top"><span class="fc-code">' + escHtml(f.code) + '</span><span class="fc-name">' + escHtml(f.name) + '</span><span class="dim-tag ' + dimClass(f.dim) + '">' + escHtml(f.dim) + '</span></div>';
      html += '<div class="fc-ic">' + escHtml(f.signal) + (icTxt ? ' · ' + escHtml(icTxt) : '') + '</div>';
      html += '<div class="fc-env">' + escHtml(f.env) + '</div>';
      html += '<div class="fc-desc">' + escHtml(f.desc) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('factorLib').innerHTML = html;
}

loadFactorLib();
</script>
</body>
</html>
