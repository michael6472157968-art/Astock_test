<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>策略回测 - A股量化分析助手</title>
<link rel="stylesheet" href="/css/app.css?v=2" />
</head>
<body>
<header class="app-header">
  <div class="header-left"><a href="/"><h1>A股量化分析助手</h1></a></div>
  <nav id="topNav" class="header-nav"></nav>
</header>
<div class="risk-banner">⚠️ 免责声明：本平台所有分析内容仅供参考，不构成任何投资建议。股市有风险，投资需谨慎。</div>
<main class="main-content">
  <h2 class="page-title">可视化策略回测</h2>
  <p class="page-desc">历史数据模拟回测，不代表未来实际收益</p>
  <div class="risk-banner" style="border-radius:6px;margin-bottom:16px">⚠️ 回测结果基于历史数据模拟，过往往胜率不构成对未来业绩的保证</div>

  <div class="card"><div class="card-header">回测参数</div><div class="card-body">
    <div class="form-group"><label class="form-label">股票代码</label><input class="form-input" id="codeInput" value="000001.SZ" style="max-width:240px" /></div>
    <div class="form-group"><label class="form-label">策略</label><select class="form-input" id="strategy" style="max-width:240px"><option value="ma_cross">均线交叉</option><option value="volume_break">放量突破</option><option value="rsi_reversal">RSI反转</option></select></div>
    <button class="btn btn-primary" onclick="run()">开始回测</button>
    <p id="msg" style="margin-top:12px;color:var(--text-secondary)"></p>
  </div></div>

  <div id="result" style="margin-top:16px"></div>
</main>
<footer class="app-footer">【风险提示】本平台所提供市场数据、技术分析、选股结果、诊股报告等内容仅供学习研究参考，不构成投资建议。投资者据此操作，风险自担。</footer>
<script src="/js/app.js?v=5"></script>
<script>
(function() {
  if (!Gate.checkPage(2)) return;
  // 非会员显示升级提示但不禁用页面
  if (!Session.isVip()) {
    Gate.showUpgradeBanner();
  }
})();

function run() {
  var code = document.getElementById('codeInput').value;
  var strategy = document.getElementById('strategy').value;
  var btn = document.querySelector('.btn-primary');
  var msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = '回测中...'; msg.textContent = '';

  API.post('/backtest/run', { stock_code: code, strategy: strategy }).then(function(r) {
    msg.textContent = '任务已提交';
    document.getElementById('result').innerHTML = '<div class="card"><div class="card-header">回测结果</div><div class="card-body"><pre style="font-size:0.8rem">' + JSON.stringify(r.data, null, 2) + '</pre></div></div>';
  }).catch(function(e) {
    msg.textContent = '提交失败: ' + (e.message || '');
    msg.style.color = 'var(--danger)';
  }).finally(function() { btn.disabled = false; btn.textContent = '开始回测'; });
}
</script>
</body>
</html>
