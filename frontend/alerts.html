<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的自选 - Stockwin 短线助手</title>
<link rel="stylesheet" href="/css/app.css?v=3" />
<script src="/lib/echarts.js"></script>
<style>
.fav-quota-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; margin-bottom: 12px;
  background: var(--color-surface); border-radius: 8px; border: 1px solid var(--color-border);
  font-size: 0.82rem; color: var(--color-text-secondary);
}
.fav-quota-bar .quota-bar-wrap {
  flex: 1; height: 6px; background: var(--color-border-light); border-radius: 3px;
  margin: 0 12px; overflow: hidden;
}
.fav-quota-bar .quota-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.quota-ok { background: var(--color-primary); }
.quota-warn { background: var(--color-warning); }
.quota-full { background: var(--color-danger); }

/* ── Group ── */
.fav-group {
  margin-bottom: 8px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 8px; overflow: hidden;
}
.fav-group-header {
  display: flex; align-items: center; padding: 8px 12px;
  cursor: pointer; user-select: none;
  background: var(--color-border-light);
  transition: background 0.15s;
}
.fav-group-header:hover { background: var(--color-border); }
.fav-group-header .group-chevron {
  width: 16px; font-size: 0.7rem; color: var(--color-text-muted);
  transition: transform 0.2s; flex-shrink: 0;
}
.fav-group-header .group-chevron.open { transform: rotate(90deg); }
.fav-group-header .group-drag-handle {
  color: var(--color-text-muted); margin: 0 6px; font-size: 0.85rem;
  cursor: grab; user-select: none; flex-shrink: 0;
}
.fav-group-header .group-name {
  flex: 1; font-size: 0.88rem; font-weight: 500;
}
.fav-group-header .group-count {
  font-size: 0.75rem; color: var(--color-text-muted); margin-right: 8px;
}
.fav-group-header .group-action {
  font-size: 0.7rem; color: var(--color-text-muted); background: none;
  border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  margin-left: 2px;
}
.fav-group-header .group-action:hover { color: var(--color-primary); background: rgba(59,130,246,0.1); }
.fav-group-header .group-action.danger:hover { color: var(--color-danger); background: rgba(239,68,68,0.1); }
.fav-group-header .group-obs-btn {
  font-size: 0.7rem; font-weight: 500; cursor: pointer;
  color: #f59e0b; border: 1px solid #f59e0b; border-radius: 4px;
  background: transparent; padding: 2px 6px; margin-left: 4px;
  transition: background 0.15s, color 0.15s;
}
.fav-group-header .group-obs-btn:hover { background: #f59e0b; color: #fff; }

.fav-group-body { display: none; }
.fav-group-body.open { display: block; }

/* ── Card ── */
.fav-card {
  display: flex; flex-direction: column; padding: 8px 10px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 8px; margin: 4px 8px;
  cursor: grab; transition: box-shadow 0.15s;
  gap: 6px; touch-action: none;
}
.fav-card:first-child { margin-top: 6px; }
.fav-card:last-child { margin-bottom: 6px; }
.fav-card:active { cursor: grabbing; }
.fav-card.dragging { opacity: 0.4; }
.fav-card.drag-over { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary); }
.fav-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.fav-card .fav-top-row { display: flex; align-items: center; gap: 8px; }
.fav-card .fav-left { display: flex; align-items: center; flex-shrink: 0; }
.fav-card .drag-handle { color: var(--color-text-muted); font-size: 0.85rem; cursor: grab; user-select: none; padding: 0 2px; }
.fav-card .fav-info { flex: 0 0 95px; min-width: 0; display: flex; flex-direction: column; justify-content: center; cursor: default; }
.fav-card .fav-code { font-size: 0.67rem; color: var(--color-text-muted); }
.fav-card .fav-name { font-size: 0.84rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-card .fav-mid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.fav-card .fav-sparkline { flex-shrink: 0; width: 120px; height: 40px; }
.fav-card .fav-signals { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px; align-content: center; }
.fav-card .signal-chip {
  font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; white-space: nowrap;
  background: var(--color-border-light); color: var(--color-text-secondary);
}
.fav-card .signal-chip.bullish { background: rgba(239,68,68,0.1); color: var(--color-danger); }
.fav-card .signal-chip.bearish { background: rgba(34,197,94,0.1); color: var(--color-success); }
.fav-card .fav-quote { flex-shrink: 0; text-align: right; display: flex; flex-direction: column; justify-content: center; min-width: 70px; }
.fav-card .fav-price { font-size: 0.88rem; font-weight: 500; }
.fav-card .fav-pct { font-size: 0.78rem; font-weight: 500; }
.fav-card .fav-bot-row {
  display: flex; align-items: center; gap: 8px;
  padding-top: 2px; border-top: 1px solid var(--color-border-light);
}
.fav-card .fav-diag-btn {
  font-size: 0.72rem; font-weight: 500; text-decoration: none;
  padding: 3px 10px; border-radius: 4px;
  color: var(--color-primary); border: 1px solid var(--color-primary);
  transition: background 0.15s, color 0.15s;
}
.fav-card .fav-diag-btn:hover { background: var(--color-primary); color: #fff; }
.fav-card .fav-obs-btn {
  font-size: 0.72rem; font-weight: 500; cursor: pointer;
  padding: 3px 10px; border-radius: 4px;
  color: #f59e0b; border: 1px solid #f59e0b;
  background: transparent; transition: background 0.15s, color 0.15s;
}
.fav-card .fav-obs-btn:hover { background: #f59e0b; color: #fff; }
.fav-card .fav-obs-btn.active { background: #f59e0b; color: #fff; }
.fav-card .fav-del { font-size: 0.7rem; color: var(--color-text-muted); background: none; border: none; cursor: pointer; padding: 3px 8px; border-radius: 4px; margin-left: auto; }
.fav-card .fav-del:hover { color: var(--color-danger); background: rgba(239,68,68,0.1); }
.fav-card .fav-score-badge {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 0.82rem; font-weight: 700; line-height: 1;
  background: var(--color-border-light); color: var(--color-text-muted);
}
.fav-card .fav-score-badge .score-label { font-size: 0.48rem; font-weight: 400; }
.fav-card .fav-risk-tag {
  flex-shrink: 0; font-size: 0.62rem; padding: 2px 5px; border-radius: 3px; white-space: nowrap;
  font-weight: 500;
}
.risk-low { background: rgba(34,197,94,0.12); color: #16a34a; }
.risk-mid-low { background: rgba(59,130,246,0.1); color: #2563eb; }
.risk-mid { background: rgba(245,158,11,0.12); color: #d97706; }
.risk-mid-high { background: rgba(249,115,22,0.12); color: #ea580c; }
.risk-high { background: rgba(239,68,68,0.12); color: #dc2626; }
.fav-card > .fav-del, .fav-card > .fav-diag-btn { display: none; }

/* ── Drop Indicator ── */
.drop-indicator {
  height: 3px; background: var(--color-primary); border-radius: 2px;
  margin: 0 8px; transition: all 0.15s;
}

/* ── Group Drop Highlight ── */
.fav-group-header.drop-target {
  background: var(--color-primary) !important; color: #fff !important;
  box-shadow: 0 0 12px rgba(22, 119, 255, 0.4);
}
.fav-group-header.drop-target .group-chevron,
.fav-group-header.drop-target .group-count,
.fav-group-header.drop-target .group-action,
.fav-group-header.drop-target .group-drag-handle { color: rgba(255,255,255,0.8) !important; }
.fav-group-header.drop-target .group-name { color: #fff !important; }

/* ── New Group Input ── */
.new-group-wrap {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  margin-bottom: 8px;
}
.new-group-wrap input {
  flex: 1; padding: 6px 10px; border: 1px dashed var(--color-border);
  border-radius: 6px; font-size: 0.82rem; background: var(--color-surface);
  color: var(--color-text);
}
.new-group-wrap input:focus { outline: none; border-color: var(--color-primary); }
.new-group-wrap button {
  padding: 6px 12px; border: none; border-radius: 6px;
  background: var(--color-primary); color: #fff; cursor: pointer;
  font-size: 0.82rem;
}
.new-group-wrap button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Group Rename Input ── */
.group-name-input {
  flex: 1; font-size: 0.88rem; font-weight: 500;
  padding: 2px 6px; border: 1px solid var(--color-primary);
  border-radius: 4px; background: var(--color-surface);
  color: var(--color-text); outline: none;
}

/* ── More Button ── */
.fav-more-btn {
  display: block; width: calc(100% - 16px); margin: 4px 8px 6px;
  padding: 6px; text-align: center;
  background: var(--color-surface); border: 1px dashed var(--color-border);
  border-radius: 6px; color: var(--color-primary); cursor: pointer;
  font-size: 0.78rem;
}
.fav-more-btn:hover { background: var(--color-border-light); }
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">我的自选</h2>
  <p class="page-desc" id="quotaDesc">加载中...</p>
  <div class="fav-quota-bar" id="quotaBar" style="display:none;">
    <span id="quotaLabel">自选额度</span>
    <div class="quota-bar-wrap"><div class="quota-bar-fill" id="quotaFill"></div></div>
    <span id="quotaText">0/0</span>
  </div>
  <div id="favMainChartPanel" class="mood-panel" style="margin-bottom:16px;display:none;">
    <div class="mood-header" style="flex-wrap:wrap;gap:6px;">
      <div style="display:flex;align-items:center;gap:0;">
        <span class="mood-title">自选速览</span>
        <div class="tabs" style="margin:0 0 0 16px;border-bottom:none;" id="favChartTabs">
          <button class="tab active" data-tab="avg_chg" onclick="switchFavTab('avg_chg')">涨跌幅均值(%)</button>
          <button class="tab" data-tab="stock_pct" onclick="switchFavTab('stock_pct')">个股涨跌幅(%)</button>
        </div>
        <span style="font-size:0.72rem;color:var(--color-text-muted);margin-left:10px;" id="favTabSubtitle">组内涨跌幅均值(%)</span>
      </div>
      <span class="mood-date" id="favMainDate">配置T日</span>
    </div>
    <div class="mood-body" style="flex-direction:column;padding:0;">
      <div id="favMainChartWrap" style="width:100%;height:320px;"></div>
      <div id="favConfigRows"></div>
      <div id="favStockPctControls" style="display:none;"></div>
    </div>
  </div>
  <div id="content" style="width:100%;"><p class="state-loading">加载中...</p></div>
  <div class="new-group-wrap" id="newGroupWrap" style="display:none;">
    <input type="text" id="newGroupInput" placeholder="输入分组名称，按 Enter 创建" maxlength="30" onkeydown="handleNewGroupKey(event)" />
    <button onclick="createNewGroup()">+ 新建</button>
  </div>
</main>
<script src="/js/app.js?v=8"></script>
<script>
if (!Session.loggedIn()) {
  document.getElementById('content').innerHTML = '<p class="state-empty">请先<a href="login.html">登录</a>使用自选功能</p>';
  document.getElementById('quotaDesc').textContent = '登录后管理自选股票';
} else {
  loadAll();
}

var _allItems = [];
var _groups = [];
var _ungroupedCount = 0;
var _quotaMax = 0;
var _quotaCurrent = 0;
var _expandedGroups = {};
var _groupPage = {};       // groupId → total visible count (0 = initial pageSize)
var _pageSize = 10;
var _dragSrc = null;
var _dragSrcGroupId = null;

// ── Quota ──

function updateQuotaBar() {
  var bar = document.getElementById('quotaBar');
  if (_quotaMax === 0 || _quotaMax >= 999) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  var ratio = _quotaCurrent / _quotaMax;
  var fill = document.getElementById('quotaFill');
  fill.style.width = (ratio * 100) + '%';
  fill.className = 'quota-bar-fill ' + (ratio >= 1 ? 'quota-full' : ratio >= 0.8 ? 'quota-warn' : 'quota-ok');
  document.getElementById('quotaText').textContent = _quotaCurrent + '/' + _quotaMax;
}

// ── Load ──

function loadAll() {
  Promise.all([
    API.get('/alerts/favorites'),
    API.get('/alerts/favorites/groups')
  ]).then(function(results) {
    var favR = results[0], grpR = results[1];
    _allItems = favR.data.items || [];
    _quotaCurrent = favR.data.quota ? favR.data.quota.current : _allItems.length;
    _quotaMax = favR.data.quota ? favR.data.quota.max : 0;
    _groups = grpR.data.groups || [];
    _ungroupedCount = grpR.data.ungrouped_count || 0;

    updateQuotaBar();
    var tier = Session.tier();
    var tierNames = {0:'游客', 1:'注册用户', 2:'月度VIP', 3:'年度VIP', 99:'管理员'};
    document.getElementById('quotaDesc').textContent =
      (tierNames[tier] || '免费用户') + ' · 自选额度 ' + _quotaCurrent + '/' + (_quotaMax >= 999 ? '无限' : _quotaMax);

    if (!_allItems.length && !_groups.length) {
      document.getElementById('content').innerHTML = '<div class="card"><div class="card-body"><p class="state-empty">暂无自选，请在<a href="diagnosis.html">诊股页面</a>搜索股票并点击「+ 自选」按钮添加。</p></div></div>';
      return;
    }
    document.getElementById('newGroupWrap').style.display = 'flex';
    renderAll();
    // 恢复上次标签页状态
    var savedTab = FavStore.getChartTab();
    if (savedTab === 'stock_pct') {
      switchFavTab('stock_pct');
    } else {
      loadFavMainChart();
    }
  }).catch(function() {
    document.getElementById('content').innerHTML = '<p class="state-error">加载失败</p>';
  });
}

// ── Render ──

function itemsForGroup(groupId) {
  return _allItems.filter(function(f) { return (f.group_id || null) === (groupId || null); });
}

function renderAll() {
  var html = '';
  html += renderUngroupedSection();
  _groups.forEach(function(g) {
    html += renderGroupSection(g);
  });
  document.getElementById('content').innerHTML = html;
  // 刷新所有观测按钮状态
  _refreshAllObserveButtons();
  // 渲染完成后恢复主图（尊重用户上次标签页选择）
  setTimeout(function() {
    var savedTab = FavStore.getChartTab();
    if (savedTab === 'stock_pct') {
      switchFavTab('stock_pct');
    } else {
      loadFavMainChart();
    }
  }, 50);
}

function renderUngroupedSection() {
  var items = itemsForGroup(null);
  if (!items.length && _groups.length > 0) return '';
  var groupId = '__ungrouped__';
  var pg = _groupPage[groupId] || 0;
  var collapsed = _expandedGroups[groupId] === false;
  var h = '<div class="fav-group" data-group-id="' + groupId + '">';
  h += '<div class="fav-group-header" onclick="toggleGroup(\'' + groupId + '\')" data-drop-group="' + groupId + '" ondragover="handleGroupDragOver(event)" ondragleave="handleGroupDragLeave(event)" ondrop="handleGroupDrop(event)">';
  h += '<span class="group-chevron' + (collapsed ? '' : ' open') + '">▶</span>';
  h += '<span class="group-name">未分组</span>';
  h += '<span class="group-count">' + items.length + '只</span>';
  h += '</div>';
  h += '<div class="fav-group-body' + (collapsed ? '' : ' open') + '" data-drop-group="' + groupId + '" ondragover="handleGroupDragOver(event)" ondragleave="handleGroupDragLeave(event)" ondrop="handleGroupDrop(event)">';
  h += renderCards(items, pg, groupId);
  h += '</div></div>';
  return h;
}

function renderGroupSection(g) {
  var items = itemsForGroup(g.id);
  var groupId = 'g_' + g.id;
  var pg = _groupPage[groupId] || 0;
  var collapsed = _expandedGroups[groupId] === false;
  var h = '<div class="fav-group" data-group-id="' + g.id + '">';
  h += '<div class="fav-group-header" data-drop-group="' + g.id + '" ondragover="handleGroupDragOver(event)" ondragleave="handleGroupDragLeave(event)" ondrop="handleGroupDrop(event)" draggable="true" ondragstart="handleGroupHeaderDragStart(event)" ondragend="handleGroupHeaderDragEnd(event)">';
  h += '<span class="group-chevron' + (collapsed ? '' : ' open') + '" onclick="event.stopPropagation();toggleGroup(\'' + groupId + '\')">▶</span>';
  h += '<span class="group-drag-handle" title="拖拽排序分组">⋮⋮</span>';
  h += '<span class="group-name" id="groupName_' + g.id + '" ondblclick="startRenameGroup(' + g.id + ',\'' + escHtml(g.name) + '\')">' + escHtml(g.name) + '</span>';
  h += '<span class="group-count">' + items.length + '只</span>';
  h += '<button class="group-obs-btn" onclick="event.stopPropagation();toggleObserveGroup(' + g.id + ',\'' + escHtml(escHtml(g.name)) + '\')" title="涨跌观测此分组">涨跌观测</button>';
  h += '<button class="group-action" onclick="event.stopPropagation();startRenameGroup(' + g.id + ',\'' + escHtml(g.name) + '\')" title="重命名">✎</button>';
  h += '<button class="group-action danger" onclick="event.stopPropagation();deleteGroupConfirm(' + g.id + ')" title="删除分组">✕</button>';
  h += '</div>';
  h += '<div class="fav-group-body' + (collapsed ? '' : ' open') + '" data-drop-group="' + g.id + '" ondragover="handleGroupDragOver(event)" ondragleave="handleGroupDragLeave(event)" ondrop="handleGroupDrop(event)">';
  h += renderCards(items, pg, groupId);
  h += '</div></div>';
  return h;
}

function renderCards(items, totalVisible, groupKey) {
  totalVisible = totalVisible || 0;
  if (!totalVisible) totalVisible = _pageSize;
  totalVisible = Math.min(totalVisible, items.length);
  var batch = items.slice(0, totalVisible);
  var codes = batch.map(function(f){return f.stock_code;});
  var h = '<div class="fav-cards-container" data-codes="' + codes.join(',') + '" data-group-key="' + groupKey + '" data-page-offset="' + pageOffset + '">';
  h += '<div class="fav-cards-inner">';
  batch.forEach(function(f) {
    h += '<div class="fav-card" draggable="true" data-code="' + f.stock_code + '" data-group-id="' + (f.group_id || '') + '" ondragstart="handleCardDragStart(event)" ondragover="handleCardDragOver(event)" ondragleave="handleCardDragLeave(event)" ondrop="handleCardDrop(event)" ondragend="handleCardDragEnd(event)">';
    h += '<div class="fav-top-row">';
    h += '<div class="fav-left"><span class="drag-handle" title="拖拽排序">⋮⋮</span></div>';
    h += '<div class="fav-info">';
    h += '<div class="fav-name">' + escHtml(f.stock_name || f.stock_code) + '</div>';
    h += '<div class="fav-code">' + f.stock_code + '</div>';
    h += '</div>';
    h += '<div class="fav-mid">';
    h += '<svg class="fav-sparkline" viewBox="0 0 120 40" data-code="' + f.stock_code + '"><polyline fill="none" stroke="var(--color-border)" stroke-width="1.5" points=""/></svg>';
    h += '<div class="fav-signals" data-code="' + f.stock_code + '"></div>';
    h += '</div>';
    h += '<div class="fav-score-badge" data-code="' + f.stock_code + '">--<span class="score-label">分</span></div>';
    h += '<div class="fav-risk-tag" data-code="' + f.stock_code + '">--</div>';
    h += '<div class="fav-quote">';
    h += '<div class="fav-price">--</div>';
    h += '<div class="fav-pct">--</div>';
    h += '</div>';
    h += '</div>';
    h += '<div class="fav-bot-row">';
    h += '<a class="fav-diag-btn" href="diagnosis.html?code=' + encodeURIComponent(f.stock_code) + '" onclick="event.stopPropagation();">诊股</a>';
    h += '<button class="fav-obs-btn" data-code="' + f.stock_code + '" onclick="event.stopPropagation();toggleObserveStock(this,\'' + f.stock_code + '\')">涨跌观测</button>';
    h += '<button class="fav-del" onclick="event.stopPropagation();removeFav(\'' + f.stock_code + '\')" title="删除自选">✕ 移除</button>';
    h += '</div>';
    h += '</div>';
  });
  h += '</div>';
  var remaining = items.length - totalVisible;
  if (remaining > 0) {
    h += '<button class="fav-more-btn" onclick="loadGroupMore(\'' + groupKey + '\')">查看更多（剩余' + remaining + '只）</button>';
  }
  h += '</div>';
  return h;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── Quotes Load ──

function loadQuotesForVisible() {
  var containers = document.querySelectorAll('.fav-cards-container');
  containers.forEach(function(ctr) {
    var codes = ctr.getAttribute('data-codes');
    if (!codes) return;
    API.get('/alerts/favorites-quotes?codes=' + encodeURIComponent(codes)).then(function(qr) {
      var quotes = qr.data.quotes || {};
      var cards = ctr.querySelectorAll('.fav-card');
      cards.forEach(function(card) {
        var code = card.getAttribute('data-code');
        var qd = quotes[code] || {};
        // Price & pct
        var priceEl = card.querySelector('.fav-price');
        var pctEl = card.querySelector('.fav-pct');
        if (priceEl) priceEl.textContent = qd.close || '--';
        if (pctEl) {
          var pct = qd.pct_chg || 0;
          pctEl.textContent = (pct > 0 ? '+' : '') + pct + '%';
          pctEl.style.color = pct > 0 ? 'var(--color-danger)' : (pct < 0 ? 'var(--color-success)' : '');
        }
        // Sparkline
        var sparkEl = card.querySelector('.fav-sparkline');
        if (sparkEl && qd.sparkline && qd.sparkline.length) {
          var polyline = sparkEl.querySelector('polyline');
          if (polyline) {
            var closes = qd.sparkline.map(function(d){return d.close;});
            var min = Math.min.apply(null, closes);
            var max = Math.max.apply(null, closes);
            var range = max - min || 1;
            var w = 120, h = 40, pad = 2;
            var pts = closes.map(function(v, i) {
              var x = pad + (i / (closes.length - 1)) * (w - pad * 2);
              var y = pad + (1 - (v - min) / range) * (h - pad * 2);
              return x.toFixed(1) + ',' + y.toFixed(1);
            }).join(' ');
            polyline.setAttribute('points', pts);
            var trend = closes[closes.length-1] >= closes[0];
            polyline.setAttribute('stroke', trend ? 'var(--color-danger)' : 'var(--color-success)');
          }
        }
        // Score badge
        var badgeEl = card.querySelector('.fav-score-badge');
        if (badgeEl && qd.score != null) {
          badgeEl.innerHTML = qd.score + '<span class="score-label">分</span>';
          var s = qd.score;
          badgeEl.style.background = s >= 75 ? 'rgba(239,68,68,0.12)' : s >= 60 ? 'rgba(245,158,11,0.12)' : s >= 40 ? 'rgba(59,130,246,0.1)' : s >= 25 ? 'rgba(249,115,22,0.12)' : 'rgba(34,197,94,0.12)';
          badgeEl.style.color = s >= 75 ? '#dc2626' : s >= 60 ? '#d97706' : s >= 40 ? '#2563eb' : s >= 25 ? '#ea580c' : '#16a34a';
        }
        // Signals — 去重+限制最多4个
        var sigEl = card.querySelector('.fav-signals');
        if (sigEl) {
          var seen = {};
          var raw = qd.signals || [];
          var dedup = [];
          for (var i = 0; i < raw.length; i++) {
            if (!seen[raw[i]]) { seen[raw[i]] = true; dedup.push(raw[i]); }
          }
          dedup = dedup.slice(0, 4);
          if (dedup.length) {
            var bullish = ['多头排列','量价齐升','RSI超卖','布林下轨','站上MA5','缩量反弹','RSI偏弱','布林偏下轨'];
            var bearish = ['空头排列','RSI超买','布林上轨','缩量回调','跌破MA5','放量滞涨','RSI偏强','布林偏上轨'];
            sigEl.innerHTML = dedup.map(function(sig) {
            var cls = bullish.indexOf(sig) >= 0 ? 'bullish' : (bearish.indexOf(sig) >= 0 ? 'bearish' : '');
            return '<span class="signal-chip ' + cls + '">' + escHtml(sig) + '</span>';
          }).join('');
          } else {
            sigEl.innerHTML = '';
          }
        }
        // Risk tag
        var riskEl = card.querySelector('.fav-risk-tag');
        var riskTags = qd.risk_tags || [];
        if (riskEl && riskTags.length) {
          riskEl.textContent = riskTags[0];
          riskEl.className = 'fav-risk-tag risk-high';
        } else if (riskEl && qd.risk) {
          var risk = qd.risk;
          riskEl.textContent = risk;
          riskEl.className = 'fav-risk-tag ' + (
            risk === '低风险' ? 'risk-low' :
            risk === '中低风险' ? 'risk-mid-low' :
            risk === '中风险' ? 'risk-mid' :
            risk === '中高风险' || risk === '高风险(ST)' ? 'risk-mid-high' :
            'risk-high');
        }
      });
    });
  });
}

// ── Card Drag ──

var _dragSrc = null;
var _dragSrcGroupId = null;
var _dropIndicator = null;
var _dragAutoScrollTimer = null;

// Block browser default text-drag + auto-scroll tracking
document.addEventListener('dragover', function(e) {
  e.preventDefault();
  if (_dragSrc) _lastDragClientY = e.clientY;
});

// Auto-scroll loop
_dragAutoScrollTimer = setInterval(function() {
  if (!_dragSrc) return;
  var EDGE = 80, SPEED = 8;
  var dy = 0;
  if (_lastDragClientY < EDGE && _lastDragClientY > 0) {
    dy = -SPEED * (1 - _lastDragClientY / EDGE);
  } else if (window.innerHeight - _lastDragClientY < EDGE) {
    dy = SPEED * ((EDGE - (window.innerHeight - _lastDragClientY)) / EDGE);
  }
  if (dy !== 0) window.scrollBy(0, dy);
}, 16);

// ── 移动端触摸拖拽 ──
var _touchDragSrc = null;
var _touchClone = null;
var _touchStartY = 0;
var _touchSrcGroupId = null;
var _touchIsDragging = false;
var TOUCH_DRAG_THRESHOLD = 8;

function getTouchDropGroup(e) {
  var el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return null;
  var header = el.closest('.fav-group-header');
  if (header) return header.getAttribute('data-drop-group');
  var body = el.closest('.fav-group-body');
  if (body) return body.getAttribute('data-drop-group');
  var card = el.closest('.fav-card');
  if (card) return card.getAttribute('data-group-id') || null;
  return null;
}

document.addEventListener('touchstart', function(e) {
  var card = e.target.closest('.fav-card');
  if (!card || !card.hasAttribute('draggable')) return;
  _touchDragSrc = card;
  _touchSrcGroupId = card.getAttribute('data-group-id') || null;
  _touchStartY = e.touches[0].clientY;
  _lastDragClientY = e.touches[0].clientY;
  _touchIsDragging = false;
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!_touchDragSrc) return;
  var touch = e.touches[0];
  _lastDragClientY = touch.clientY;
  if (!_touchIsDragging) {
    if (Math.abs(touch.clientY - _touchStartY) > TOUCH_DRAG_THRESHOLD) {
      _touchIsDragging = true;
      _touchDragSrc.classList.add('dragging');
      _touchClone = _touchDragSrc.cloneNode(true);
      _touchClone.style.position = 'fixed';
      _touchClone.style.zIndex = '9999';
      _touchClone.style.opacity = '0.85';
      _touchClone.style.pointerEvents = 'none';
      _touchClone.style.width = _touchDragSrc.offsetWidth + 'px';
      _touchClone.style.left = (touch.clientX - _touchDragSrc.offsetWidth / 2) + 'px';
      _touchClone.style.top = (touch.clientY - 30) + 'px';
      document.body.appendChild(_touchClone);
    } else {
      return;
    }
  }
  e.preventDefault();
  if (_touchClone) {
    _touchClone.style.left = (touch.clientX - _touchDragSrc.offsetWidth / 2) + 'px';
    _touchClone.style.top = (touch.clientY - 30) + 'px';
  }
  document.querySelectorAll('.fav-group-header.drop-target').forEach(function(h) { h.classList.remove('drop-target'); });
  var groupId = getTouchDropGroup(touch);
  if (groupId !== null) {
    var hdr = document.querySelector('[data-drop-group="' + groupId + '"]');
    if (hdr) {
      if (hdr.classList.contains('fav-group-body')) {
        hdr = hdr.parentElement.querySelector('.fav-group-header');
      }
      if (hdr) hdr.classList.add('drop-target');
    }
  }
}, { passive: false });

document.addEventListener('touchend', function(e) {
  if (!_touchDragSrc) return;
  if (_touchClone) { _touchClone.remove(); _touchClone = null; }
  _touchDragSrc.classList.remove('dragging');
  document.querySelectorAll('.fav-group-header.drop-target').forEach(function(h) { h.classList.remove('drop-target'); });

  if (_touchIsDragging) {
    var touch = e.changedTouches[0];
    var groupId = getTouchDropGroup(touch);
    var srcCode = _touchDragSrc.getAttribute('data-code');
    if (groupId === '__ungrouped__') groupId = null;
    else if (groupId) groupId = parseInt(groupId);
    if (srcCode && String(groupId) !== String(_touchSrcGroupId || '')) {
      moveStockToGroup(srcCode, groupId);
    }
  }

  _touchDragSrc = null;
  _touchSrcGroupId = null;
  _touchIsDragging = false;
  _lastDragClientY = 0;
});

function ensureDropIndicator() {
  if (!_dropIndicator) {
    _dropIndicator = document.createElement('div');
    _dropIndicator.className = 'drop-indicator';
  }
}

function handleCardDragStart(e) {
  _dragSrc = e.target.closest('.fav-card');
  if (!_dragSrc) return;
  _dragSrcGroupId = _dragSrc.getAttribute('data-group-id') || null;
  _dragSrc.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragSrc.getAttribute('data-code'));
}

function handleCardDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  var container = e.target.closest('.fav-cards-container');
  if (!container) return;
  var card = e.target.closest('.fav-card');
  if (!card || card === _dragSrc) {
    removeDropIndicator();
    return;
  }

  // Remove old indicator
  removeDropIndicator();

  // Insert indicator above or below the target card
  var rect = card.getBoundingClientRect();
  var midY = rect.top + rect.height / 2;
  ensureDropIndicator();
  if (e.clientY < midY) {
    card.parentNode.insertBefore(_dropIndicator, card);
  } else {
    card.parentNode.insertBefore(_dropIndicator, card.nextSibling);
  }

  // Highlight the bordering card
  clearAllCardHighlights();
  card.classList.add('drag-over');
}

function handleCardDragLeave(e) {
  e.stopPropagation();
}

function handleCardDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  removeDropIndicator();
  clearAllCardHighlights();

  var targetCard = e.target.closest('.fav-card');
  var targetContainer = e.target.closest('.fav-cards-container');

  // Check group header drop
  var targetHeader = e.target.closest('.fav-group-header');
  if (targetHeader && _dragSrc) {
    var targetGroupId = targetHeader.getAttribute('data-drop-group');
    if (targetGroupId === '__ungrouped__') targetGroupId = null;
    else targetGroupId = parseInt(targetGroupId);
    var srcCode = _dragSrc.getAttribute('data-code');
    if (srcCode && String(targetGroupId) !== String(_dragSrcGroupId || '')) {
      moveStockToGroup(srcCode, targetGroupId);
    }
    resetDrag();
    return;
  }

  if (!targetCard || !_dragSrc || targetCard === _dragSrc) { resetDrag(); return; }
  if (!targetContainer) { resetDrag(); return; }

  // Determine drop position relative to target
  var cards = Array.from(targetContainer.querySelectorAll('.fav-card'));
  var srcIdx = cards.indexOf(_dragSrc);
  var tgtIdx = cards.indexOf(targetCard);
  if (srcIdx < 0 || tgtIdx < 0) { resetDrag(); return; }

  var rect = targetCard.getBoundingClientRect();
  var midY = rect.top + rect.height / 2;
  var insertAfter = e.clientY >= midY;

  var srcCode = _dragSrc.getAttribute('data-code');
  var globalSrcIdx = _allItems.findIndex(function(f){return f.stock_code === srcCode;});

  // Find global target index based on drop position
  var tgtCode = targetCard.getAttribute('data-code');
  var globalTgtIdx = _allItems.findIndex(function(f){return f.stock_code === tgtCode;});
  if (insertAfter) globalTgtIdx += 1;

  if (globalSrcIdx >= 0 && globalTgtIdx >= 0) {
    var moved = _allItems.splice(globalSrcIdx, 1)[0];
    var insertAt = globalSrcIdx < globalTgtIdx ? globalTgtIdx - 1 : globalTgtIdx;
    _allItems.splice(insertAt, 0, moved);
  }

  var groupKey = targetContainer.getAttribute('data-group-key');
  refreshGroupSection(groupKey);

  var ordered = _allItems.map(function(f){return f.stock_code;});
  API.put('/alerts/favorites/reorder', { ordered_codes: ordered }).catch(function(){});

  resetDrag();
}

function handleCardDragEnd(e) {
  removeDropIndicator();
  clearAllCardHighlights();
  resetDrag();
}

function removeDropIndicator() {
  if (_dropIndicator && _dropIndicator.parentNode) {
    _dropIndicator.parentNode.removeChild(_dropIndicator);
  }
}

function clearAllCardHighlights() {
  document.querySelectorAll('.fav-card.drag-over').forEach(function(c) {
    c.classList.remove('drag-over');
  });
}

function resetDrag() {
  if (_dragSrc) _dragSrc.classList.remove('dragging');
  _dragSrc = null;
  _dragSrcGroupId = null;
}

function handleGroupDrop(e) {
  e.preventDefault();
  var targetGroupId = null;

  var header = e.target.closest('.fav-group-header');
  if (header) {
    targetGroupId = header.getAttribute('data-drop-group');
  } else {
    var body = e.target.closest('.fav-group-body');
    if (body) {
      var hdr = body.parentElement.querySelector('.fav-group-header');
      if (hdr) targetGroupId = hdr.getAttribute('data-drop-group');

  }

  if (!targetGroupId || !_dragSrc) { clearAllDragState(); resetDrag(); return; }

  // Remove highlight from all headers
  document.querySelectorAll('.fav-group-header.drop-target').forEach(function(h) { h.classList.remove('drop-target'); });

  if (targetGroupId === '__ungrouped__') targetGroupId = null;
  else targetGroupId = parseInt(targetGroupId);

  var srcCode = _dragSrc.getAttribute('data-code');
  if (srcCode && String(targetGroupId) !== String(_dragSrcGroupId || '')) {
    moveStockToGroup(srcCode, targetGroupId);
  }
  resetDrag();

function loadGroupMore(groupKey) {
  var current = _groupPage[groupKey] || 0;
  if (!current) current = _pageSize;
  _groupPage[groupKey] = current + _pageSize;

  // 记录当前最后一张可见卡的屏幕位置
  var groupId = groupKey === '__ungrouped__' ? '__ungrouped__' : groupKey;
  var lastCard = document.querySelector('[data-group-id="' + groupId + '"] .fav-card:last-child');
  var anchorY = lastCard ? lastCard.getBoundingClientRect().top : null;

  refreshGroupSection(groupKey);
  loadQuotesForVisible();

  if (anchorY != null) {
    // 找到重建后同一张卡片，补偿滚动偏移
    var cards = document.querySelectorAll('[data-group-id="' + groupId + '"] .fav-card');
    if (cards.length) {
      var diff = cards[cards.length - 1].getBoundingClientRect().top - anchorY;
      window.scrollBy(0, diff);
    }
  }
}

function refreshGroupSection(groupKey) {
  var groupId, isUngrouped;
  if (groupKey === '__ungrouped__') {
    groupId = '__ungrouped__'; isUngrouped = true;
  } else {
    groupId = parseInt(groupKey.replace('g_', ''));
    isUngrouped = false;
  }
  var groupEl = document.querySelector('[data-group-id="' + groupId + '"]');
  if (!groupEl) return;
  var body = groupEl.querySelector('.fav-group-body');
  if (!body) return;

  var items = itemsForGroup(isUngrouped ? null : groupId);
  var pg = _groupPage[groupKey] || 0;
  body.innerHTML = renderCards(items, pg, groupKey);
  var countEl = groupEl.querySelector('.group-count');

function invalidateFavStatsCache() {
  // 分组变更时下次loadFavMainChart会重新拉API（无需操作）
}

function loadFavMainChart() {
  var tDates = FavStore.getTDates();

  var groupInfos = [];
  _groups.forEach(function(g) {
    groupInfos.push({ key: String(g.id), name: g.name, count: g.stock_count });
  });

  if (!groupInfos.length) {
    document.getElementById('favMainChartPanel').style.display = 'none';
    return;
  }

  function renderFromData(data) {
    var allDates = data.dates || [];
    var groupData = [];
    groupInfos.forEach(function(gi) {
      var found = null;
      (data.groups || []).forEach(function(g) {
        if (String(g.id) === gi.key) found = g;
      });
      if (found) {
        var td = tDates[gi.key];
        if (!td && allDates.length > 0) td = allDates[allDates.length - 1];
        var clipStart = allDates.length;
        for (var i = 0; i < allDates.length; i++) {
          if (allDates[i] >= td) { clipStart = i; break; }
        }
        var dcMap = {};
        (found.daily_chg || []).forEach(function(d) { dcMap[d.date] = d.avg_chg; });
        var clippedChg = allDates.map(function(d, idx) {
          if (idx >= clipStart) {
            var v = dcMap[d];
            return { date: d, avg_chg: v !== undefined ? v : null };
          }
          return { date: d, avg_chg: null };
        });
        groupData.push({
          name: found.name,
          stockCount: found.stock_count,
          dailyChg: clippedChg,
          key: gi.key
        });
      }
    });

    renderFavMainChart(groupData, allDates);
    renderFavConfigRows(groupInfos, tDates, allDates);

    // 通知子图当前模式
    // 注意：不在这里覆盖 chartTab，由 switchFavTab 写入

    var viewForSub = { groups: [], ungrouped: null, dates: allDates };
    groupData.forEach(function(gd) {
      var entry = { name: gd.name, stock_count: gd.stockCount, daily_chg: gd.dailyChg };
      if (gd.key === '__ungrouped__') {
        viewForSub.ungrouped = entry;
      } else {
        entry.id = parseInt(gd.key) || 0;
        viewForSub.groups.push(entry);
      }
    });
    try { FavStore.setStatsView(viewForSub); } catch(e) {}
  }

  if (_favStatsReq) clearTimeout(_favStatsReq);
  _favStatsReq = setTimeout(function() {
    API.get('/alerts/favorites/groups/stats').then(function(r) {
      var data = r.data || { groups: [], ungrouped: null, dates: [] };
      renderFromData(data);
    }).catch(function() {
      document.getElementById('favMainChartPanel').style.display = 'none';
    });
  }, 300);
}

function renderFavMainChart(groupData, dates) {
  var wrap = document.getElementById('favMainChartWrap');
  if (!wrap) return;
  document.getElementById('favMainChartPanel').style.display = '';

  var xLabels = dates.map(function(d) { return fmtDate(d); });
  if (!xLabels.length || !groupData.length) {
    if (_favMainChart) { _favMainChart.dispose(); _favMainChart = null; }
    return;
  }

  if (_favMainChart) _favMainChart.dispose();
  _favMainChart = echarts.init(wrap);

  var colors = ['#1677ff', '#f59e0b', '#a855f7', '#14b143', '#ef232a', '#06b6d4', '#ec4899', '#f97316'];

  var seriesOpts = groupData.map(function(s) {
    var dcMap = {};
    var gid = parseInt(s.key) || 0;
    var ci = Math.abs(gid) % colors.length;
    (s.dailyChg || []).forEach(function(d) { dcMap[d.date] = d.avg_chg; });
    var values = dates.map(function(d) { return dcMap[d] !== undefined ? dcMap[d] : null; });

    return {
      name: s.name + ' (' + s.stockCount + '只)',
      type: 'line',
      data: values,
      smooth: true,
      symbol: 'circle',
      symbolSize: 5,
      lineStyle: { width: 2, color: colors[ci] },
      itemStyle: { color: colors[ci] },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: colors[ci] + '30' },
          { offset: 1, color: colors[ci] + '02' }
        ])
      },
      // 不显示 markPoint/markLine，保持图表简洁
    };
  });

  _favMainChart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: function(params) {
        var lines = ['<b>' + params[0].axisValue + '</b>'];
        params.forEach(function(p) {
          var v = p.value;
          lines.push(p.marker + ' ' + p.seriesName + ': 均值 ' + (v != null ? (v >= 0 ? '+' : '') + v + '%' : '--'));
        });
        return lines.join('<br/>');
      }
    },
    legend: { type: 'scroll', bottom: 0, textStyle: { color: '#8392A5', fontSize: 11 }, itemWidth: 14, itemHeight: 10 },
    grid: { left: 18, right: 12, top: 8, bottom: 36 },
    xAxis: {
      type: 'category', data: xLabels, boundaryGap: false,
      axisLabel: { color: '#8392A5', fontSize: 10 },
      axisLine: { lineStyle: { color: 'rgba(128,128,128,0.15)' } },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'value',
      axisLabel: { color: '#8392A5', fontSize: 10, formatter: '{value}%' },
      splitLine: { lineStyle: { color: 'rgba(128,128,128,0.1)' } }
    },
    series: seriesOpts
  });
}

function renderFavConfigRows(groupInfos, tDates, allDates) {
  var rows = document.getElementById('favConfigRows');
  if (!rows) return;
  var minDate = allDates.length > 0 ? date8toPicker(allDates[0]) : '';
  var maxDate = allDates.length > 0 ? date8toPicker(allDates[allDates.length - 1]) : '';
  var colors = ['#1677ff', '#f59e0b', '#a855f7', '#14b143', '#ef232a', '#06b6d4', '#ec4899', '#f97316'];
  var html = '';
  groupInfos.forEach(function(gi) {
    var td = tDates[String(gi.key)] || maxDate.replace(/-/g, '');
    var gid = parseInt(gi.key) || 0;
    var ci = Math.abs(gid) % colors.length;
    html += '<div class="fav-config-row">';
    html += '<span class="color-dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + colors[ci] + ';margin-right:6px;flex-shrink:0;"></span>';
    html += '<span style="flex:1;font-weight:500;">' + gi.name + '</span>';
    html += '<span style="font-size:0.75rem;color:var(--color-text-muted);margin-right:8px;">' + gi.count + '只</span>';
    html += '<span style="font-size:0.75rem;color:var(--color-text-muted);margin-right:4px;">T日</span>';
    html += '<input type="date" value="' + date8toPicker(td) + '" min="' + minDate + '" max="' + maxDate + '" onchange="onTDateChange(\'' + gi.key + '\', this, \'' + minDate + '\', \'' + maxDate + '\')" style="width:130px;" />';
    html += '</div>';
  });
  rows.innerHTML = html;
}

function onTDateChange(groupKey, inputEl, minDate, maxDate) {
  var pickerVal = inputEl.value;
  if (pickerVal < minDate || pickerVal > maxDate) {
    alert('T日超出可选范围（' + minDate + ' ~ ' + maxDate + '）');
    inputEl.value = inputEl.defaultValue;
    return;
  }
  inputEl.defaultValue = pickerVal;
  var dt = pickerToDate8(pickerVal);
  FavStore.setTDate(groupKey, dt);
  loadFavMainChart();
}

window.addEventListener('resize', function() {
  if (_favMainChart) _favMainChart.resize();
});

// ── 标签切换 ──
var _stockPctColors = ['#1677ff', '#f59e0b', '#a855f7', '#14b143', '#ef232a', '#06b6d4', '#ec4899', '#f97316', '#84cc16', '#fb923c'];

function _stockPctColorForCode(code) { return FavStore.getStockPctColor(code); }
var _favStockPctReq = null;

function switchFavTab(tabId) {
  FavStore.setChartTab(tabId);
  document.querySelectorAll('#favChartTabs .tab').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
  var subtitle = document.getElementById('favTabSubtitle');
  var configRows = document.getElementById('favConfigRows');
  var pctCtrls = document.getElementById('favStockPctControls');
  var hasGroups = _groups && _groups.length > 0;

  if (tabId === 'stock_pct') {
    if (subtitle) subtitle.textContent = '个股累计涨跌幅(%)';
    if (configRows) configRows.style.display = 'none';
    if (pctCtrls) pctCtrls.style.display = '';
    loadFavStockPctChart();
  } else {
    if (subtitle) subtitle.textContent = '组内涨跌幅均值(%)';
    if (configRows) configRows.style.display = '';
    if (pctCtrls) pctCtrls.style.display = 'none';
    if (hasGroups) {
      loadFavMainChart();
    } else {
      document.getElementById('favMainChartPanel').style.display = 'none';
    }
  }
}

// ── 个股涨跌幅模式 ──
function loadFavStockPctChart() {
  var codes = FavStore.getStockPctCodes();
  if (!codes.length) {
    var allCodes = [];
    (_allItems || []).forEach(function(item) { allCodes.push(item.stock_code); });
    if (!allCodes.length) {
      document.getElementById('favMainChartPanel').style.display = 'none';
      return;
    }
    codes = allCodes.slice(0, 5);
    FavStore.setStockPctCodes(codes);
  }

  document.getElementById('favMainChartPanel').style.display = '';

  if (_favStockPctReq) clearTimeout(_favStockPctReq);
  _favStockPctReq = setTimeout(function() {
    var qs = 'codes=' + encodeURIComponent(codes.join(','));
    API.get('/alerts/favorites/stock-prices?' + qs).then(function(r) {
      var data = r.data || { stocks: [], dates: [] };
      renderFavStockPctChart(data);
      renderFavStockPctControls(data);

      // 写入子图缓存
      var viewForSub = { tab: 'stock_pct', dates: data.dates || [], stocks: data.stocks || [] };
      try { FavStore.setStockPctView(viewForSub); } catch(e) {}
    }).catch(function() {
      document.getElementById('favMainChartPanel').style.display = 'none';
    });
  }, 300);
}

function renderFavStockPctChart(data) {
  var wrap = document.getElementById('favMainChartWrap');
  if (!wrap) return;
  var dates = data.dates || [];
  var stocks = data.stocks || [];
  var xLabels = dates.map(function(d) { return fmtDate(d); });

  if (!xLabels.length || !stocks.length) {
    if (_favMainChart) { _favMainChart.dispose(); _favMainChart = null; }
    return;
  }

  if (_favMainChart) _favMainChart.dispose();
  _favMainChart = echarts.init(wrap);

  var tDates = FavStore.getTDates();

  var seriesOpts = stocks.map(function(st) {
    var code = st.ts_code;
    var pctMap = {};
    (st.daily || []).forEach(function(d) { pctMap[d.date] = d.pct_chg; });

    // 该个股的T日（若未设置则用窗口首日作起点）
    var tDateKey = '__sp_' + code;
    var stockTDate = tDates[tDateKey] || dates[0];

    var cum = 0;
    var hasFirst = false;
    var values = dates.map(function(d) {
      if (d < stockTDate) return null;
      var pct = pctMap[d];
      if (pct != null) {
        if (!hasFirst) { hasFirst = true; cum = 0; }
        cum += pct;
        return +cum.toFixed(2);
      }
      return hasFirst ? +cum.toFixed(2) : null;
    });
    var color = _stockPctColorForCode(code);
    return {
      name: st.name + ' (' + code + ')',
      type: 'line',
      data: values,
      smooth: true,
      symbol: 'circle',
      symbolSize: 5,
      lineStyle: { width: 2, color: color },
      itemStyle: { color: color },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: color + '30' },
          { offset: 1, color: color + '02' }
        ])
      }
    };
  });

  _favMainChart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: function(params) {
        var lines = ['<b>' + params[0].axisValue + '</b>'];
        params.forEach(function(p) {
          var v = p.value;
          lines.push(p.marker + ' ' + p.seriesName + ': ' + (v != null ? (v >= 0 ? '+' : '') + v + '%' : '--'));
        });
        return lines.join('<br/>');
      }
    },
    legend: { type: 'scroll', bottom: 0, textStyle: { color: '#8392A5', fontSize: 11 }, itemWidth: 14, itemHeight: 10 },
    grid: { left: 18, right: 12, top: 8, bottom: 36 },
    xAxis: {
      type: 'category', data: xLabels, boundaryGap: false,
      axisLabel: { color: '#8392A5', fontSize: 10 },
      axisLine: { lineStyle: { color: 'rgba(128,128,128,0.15)' } },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'value',
      axisLabel: { color: '#8392A5', fontSize: 10, formatter: '{value}%' },
      splitLine: { lineStyle: { color: 'rgba(128,128,128,0.1)' } }
    },
    series: seriesOpts
  });
}

function renderFavStockPctControls(data) {
  var ctrls = document.getElementById('favStockPctControls');
  if (!ctrls) return;

  var stocks = data.stocks || [];
  var dates = data.dates || [];
  var minDate = dates.length > 0 ? date8toPicker(dates[0]) : '';
  var maxDate = dates.length > 0 ? date8toPicker(dates[dates.length - 1]) : '';
  var tDates = FavStore.getTDates();
  var selCodes = FavStore.getStockPctCodes();
  var selSet = {};
  selCodes.forEach(function(c) { selSet[c] = true; });

  var html = '';
  html += '<div style="font-size:0.72rem;color:var(--color-text-muted);margin-bottom:8px;">观测个股 · 每只可独立设定T日（最多5只）</div>';

  var selected = [];
  var unselected = [];
  stocks.forEach(function(st) {
    if (selSet[st.ts_code]) {
      selected.push(st);
    } else {
      unselected.push(st);
    }
  });

  selected.forEach(function(st) {
    var code = st.ts_code;
    var tDateKey = '__sp_' + code;
    var td = tDates[tDateKey] || (dates.length > 0 ? dates[dates.length - 1] : '');
    var color = _stockPctColorForCode(code);
    html += '<div class="fav-stock-pct-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--color-border-light);">';
    html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + color + ';flex-shrink:0;"></span>';
    html += '<span style="flex:1;font-weight:500;font-size:0.82rem;">' + escHtml(st.name) + ' <span style="font-size:0.67rem;color:var(--color-text-muted);">' + code + '</span></span>';
    html += '<span style="font-size:0.72rem;color:var(--color-text-muted);">T日</span>';
    html += '<input type="date" value="' + date8toPicker(td) + '" min="' + minDate + '" max="' + maxDate + '" onchange="onStockPctTDateChange(\'' + code + '\', this, \'' + minDate + '\', \'' + maxDate + '\')" style="width:130px;" />';
    html += '<button onclick="removeStockPctObserve(\'' + code + '\')" style="background:none;border:none;color:var(--color-text-muted);cursor:pointer;font-size:0.9rem;padding:2px 6px;" title="取消观测">✕</button>';
    html += '</div>';
  });

  if (unselected.length > 0 && selected.length < 5) {
    html += '<div style="margin-top:8px;font-size:0.7rem;color:var(--color-text-muted);margin-bottom:4px;">可添加（点击选择）</div>';
    html += '<div class="fav-stock-pct-chips">';
    unselected.forEach(function(st) {
      html += '<span class="fav-stock-pct-chip" data-code="' + st.ts_code + '" onclick="toggleStockPctChip(this)" style="border-color:transparent;">'
        + escHtml(st.name)
        + '</span>';
    });
    html += '</div>';
  }

  ctrls.innerHTML = html;
}

function toggleStockPctChip(chip) {
  var code = chip.getAttribute('data-code');
  var codes = FavStore.getStockPctCodes();
  var idx = codes.indexOf(code);

  if (idx >= 0) {
    codes.splice(idx, 1);
  } else {
    if (codes.length >= 5) {
      showToast('最多观测5只股票');
      return;
    }
    codes.push(code);
  }
  FavStore.setStockPctCodes(codes);
  loadFavStockPctChart();
}

function removeStockPctObserve(code) {
  var codes = FavStore.getStockPctCodes();
  var idx = codes.indexOf(code);
  if (idx >= 0) codes.splice(idx, 1);
  FavStore.setStockPctCodes(codes);
  loadFavStockPctChart();
}

function onStockPctTDateChange(code, inputEl, minDate, maxDate) {
  var val = inputEl.value;
  if (val < minDate || val > maxDate) {
    alert('T日超出可选范围（' + minDate + ' ~ ' + maxDate + '）');
    inputEl.value = inputEl.defaultValue;
    return;
  }
  inputEl.defaultValue = val;
  FavStore.setTDate('__sp_' + code, pickerToDate8(val));
  loadFavStockPctChart();
}

// ── 分组管理 ──

// Load quotes after DOM render
setTimeout(loadQuotesForVisible, 100);
</script>
