<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自选预警 - Stockwin 短线助手</title>
<link rel="stylesheet" href="/css/app.css?v=3" />
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">自选股异动预警</h2>
  <p class="page-desc">技术面信号：放量突破压力位、跌破支撑位、MACD金叉死叉、RSI超买超卖</p>
  <div id="content" style="width:100%;"><p class="state-loading">加载中...</p></div>
</main>
<script src="/js/app.js?v=5"></script>
<script>
if (!Session.loggedIn()) {
  document.getElementById('content').innerHTML = '<p class="state-empty">请先<a href="login.html">登录</a>使用预警功能</p>';
} else {
  loadFavorites();
}

function loadFavorites() {
  API.get('/alerts/favorites').then(function(r) {
    var items = r.data.items || [];
    if (!items.length) {
      document.getElementById('content').innerHTML = '<div class="card"><div class="card-body"><p class="state-empty">暂无自选，请在<a href="diagnosis.html">诊股页面</a>搜索股票并点击「+ 自选」按钮添加。</p></div></div>';
      loadNotifications();
    } else {
      var codes = items.map(function(f){return f.stock_code;}).join(',');
      API.get('/alerts/favorites-quotes?codes=' + encodeURIComponent(codes)).then(function(qr) {
        var quotes = qr.data.quotes || {};
        var tableHtml = '<div class="card"><div class="card-header">我的自选股（' + items.length + '只）</div><div class="card-body"><table class="data-table" style="width:100%;"><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>操作</th></tr></thead><tbody>';
        items.forEach(function(f) {
          var qd = quotes[f.stock_code] || {};
          var pct = qd.pct_chg || 0;
          var color = pct > 0 ? 'color:var(--color-danger)' : (pct < 0 ? 'color:var(--color-success)' : '');
          tableHtml += '<tr>';
          tableHtml += '<td><a href="diagnosis.html?code=' + encodeURIComponent(f.stock_code) + '">' + f.stock_code + '</a></td>';
          tableHtml += '<td>' + (qd.name || '--') + '</td>';
          tableHtml += '<td>' + (qd.close || '--') + '</td>';
          tableHtml += '<td style="' + color + '">' + (pct > 0 ? '+' : '') + pct + '%</td>';
          tableHtml += '<td><button class="btn btn-sm btn-outline" onclick="removeFav(\'' + f.stock_code + '\')">删除</button></td>';
          tableHtml += '</tr>';
        });
        tableHtml += '</tbody></table></div></div>';
        document.getElementById('content').innerHTML = tableHtml;
        loadNotifications();
      }).catch(function() {
        document.getElementById('content').innerHTML = '<p class="state-error">加载行情失败</p>';
      });
    }
  }).catch(function() {
    document.getElementById('content').innerHTML = '<p class="state-error">加载失败</p>';
  });
}

function loadNotifications() {
  API.get('/alerts/notifications').then(function(r) {
    var notifs = r.data.items || [];
    var container = document.getElementById('content');
    if (!notifs.length) {
      container.insertAdjacentHTML('beforeend', '<div class="card" style="margin-top:16px"><div class="card-header">异动预警通知</div><div class="card-body"><p class="state-empty">暂无预警通知。收盘后15:40系统将自动扫描生成异动预警。</p></div></div>');
      return;
    }
    var html = '<div class="card" style="margin-top:16px"><div class="card-header">异动预警通知（' + notifs.length + '条）</div><div class="card-body"><table class="data-table" style="width:100%;"><thead><tr><th>股票</th><th>类型</th><th>内容</th><th>时间</th></tr></thead><tbody>';
    notifs.forEach(function(n) {
      var typeClass = '';
      if (n.alert_type && n.alert_type.indexOf('金叉') >= 0 || n.alert_type && n.alert_type.indexOf('超卖') >= 0) typeClass = 'signal-bullish';
      else if (n.alert_type && (n.alert_type.indexOf('死叉') >= 0 || n.alert_type.indexOf('超买') >= 0)) typeClass = 'signal-bearish';
      html += '<tr>';
      html += '<td><a href="diagnosis.html?code=' + encodeURIComponent(n.ts_code) + '">' + (n.stock_name || n.ts_code) + '</a></td>';
      html += '<td><span class="signal-tag ' + typeClass + '">' + n.alert_type + '</span></td>';
      html += '<td>' + n.content + '</td>';
      html += '<td style="font-size:0.8rem;color:var(--color-text-muted)">' + (n.created_at ? n.created_at.slice(0,16).replace('T',' ') : '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function removeFav(code) {
  API.del('/alerts/favorites/' + encodeURIComponent(code)).then(function() { loadFavorites(); });
}
</script>
</body>
</html>
