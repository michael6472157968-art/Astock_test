<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>选股池 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=15" />
<style>
.toolbar { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-bottom:8px; }
.btn-sm { padding:6px 14px; font-size:0.8rem; border-radius:6px; border:1px solid var(--color-border); background:var(--color-card); color:var(--color-text); cursor:pointer; white-space:nowrap; }
.btn-sm:hover { border-color:var(--color-primary); color:var(--color-primary); }
.dropdown { position:relative; }
.dropdown-menu { display:none; position:absolute; top:100%; right:0; margin-top:4px; background:var(--color-card); border:1px solid var(--color-border); border-radius:8px; padding:8px 0; min-width:200px; box-shadow:var(--shadow-md); z-index:10; }
.dropdown-menu.show { display:block; }
.dropdown-menu label { display:flex; align-items:center; gap:8px; padding:8px 16px; font-size:0.8rem; cursor:pointer; color:var(--color-text); white-space:nowrap; }
.dropdown-menu label:hover { background:var(--color-bg); }
.dropdown-menu input[type=checkbox] { accent-color:var(--color-primary); }
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">场景化选股池</h2>
  <p class="page-desc">基于历史数据和技术指标自动筛选，不代表未来走势预测</p>
  <div class="risk-banner" style="border-radius:6px;margin-bottom:16px">⚠️ 选股结果基于历史数据自动筛选，不构成买入建议，请独立决策</div>

  <div class="tabs" id="tabs"></div>

  <div class="stat-grid" id="poolStats" style="margin-bottom:20px">
    <div class="stat-card"><div class="stat-label">策略总数</div><div class="stat-value" style="font-size:1.2rem;">8</div></div>
    <div class="stat-card"><div class="stat-label">当前策略</div><div class="stat-value" style="font-size:1.2rem;" id="statName">热点龙头池</div></div>
    <div class="stat-card"><div class="stat-label">信号数量</div><div class="stat-value" style="font-size:1.2rem;" id="statCount">--</div></div>
    <div class="stat-card"><div class="stat-label">数据日期</div><div class="stat-value" style="font-size:1rem;" id="statDate">--</div></div>
  </div>

  <div class="toolbar">
    <div class="dropdown">
      <button class="btn-sm" onclick="document.getElementById('filterMenu').classList.toggle('show')" id="btnFilter">
        <span id="btnFilterLabel">🔽 板块筛选（全部）</span>
      </button>
      <div class="dropdown-menu" id="filterMenu">
        <label><input type="checkbox" checked onchange="onFilterChange()" id="chkNormal"> 普通股票</label>
        <label><input type="checkbox" checked onchange="onFilterChange()" id="chk300"> 创业板 (300/301)</label>
        <label><input type="checkbox" checked onchange="onFilterChange()" id="chk688"> 科创板 (688)</label>
        <label><input type="checkbox" checked onchange="onFilterChange()" id="chk920"> 北交所 (920)</label>
      </div>
    </div>
    <button class="btn-sm" onclick="doRefresh()" id="btnRefresh">🔄 刷新</button>
  </div>

  <div class="card"><div class="card-body" id="content">
    <p class="state-loading">加载中...</p>
  </div></div>
</main>
<script src="/js/app.js?v=18"></script>
<script>
var pools = [
  { type: 'hot_leader', name: '热点龙头池' },
  { type: 'dip_ambush', name: '低吸埋伏池' },
  { type: 'oversold_rebound', name: '超跌反弹池' },
  { type: 'steady_swing', name: '稳健波段池' },
  { type: 'short_t3_momentum', name: 'T+3 追涨' },
  { type: 'short_t3_dip', name: 'T+3 低吸' },
  { type: 'short_t7_momentum', name: 'T+7 追涨' },
  { type: 'short_t7_dip', name: 'T+7 低吸' },
  { type: 'factor_daily', name: '因子选股' },
];
var activePool = 'hot_leader';
var allItems = [];
var currentTradeDate = '';

function checked(id) { return document.getElementById(id).checked; }

function getExcludeParams() {
  var p = [];
  if (!checked('chk300')) { p.push('exclude_300=true'); p.push('exclude_301=true'); }
  if (!checked('chk688')) p.push('exclude_688=true');
  if (!checked('chk920')) p.push('exclude_920=true');
  return p.length ? '?' + p.join('&') : '';
}

function isNormal(code) {
  return !(code.startsWith('300') || code.startsWith('301') || code.startsWith('688') || code.startsWith('920'));
}

function filterItems(items) {
  var showNormal = checked('chkNormal');
  var show300   = checked('chk300');
  var show688   = checked('chk688');
  var show920   = checked('chk920');
  return items.filter(function(i) {
    var c = i.stock_code || '';
    if (!showNormal && isNormal(c)) return false;
    if (!show300 && (c.startsWith('300') || c.startsWith('301'))) return false;
    if (!show688 && c.startsWith('688')) return false;
    if (!show920 && c.startsWith('920')) return false;
    return true;
  });
}

function onFilterChange() {
  var names = [];
  if (checked('chkNormal')) names.push('普通');
  if (checked('chk300')) names.push('创业板');
  if (checked('chk688')) names.push('科创');
  if (checked('chk920')) names.push('北交');
  var all = checked('chkNormal') && checked('chk300') && checked('chk688') && checked('chk920');
  var label = document.getElementById('btnFilterLabel');
  if (all) label.textContent = '🔽 板块筛选（全部）';
  else if (names.length === 0) label.textContent = '🔽 板块筛选（无）';
  else label.textContent = '🔽 板块筛选（' + names.join('/') + '）';
  // 重新拉取数据（后端按筛选条件返回）
  loadPool(activePool);
}

function doRefresh() {
  var btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = '刷新中...';
  // 先同步最新日线，再重新计算选股池
  API.post('/admin/tasks/run-daily-batch').then(function() {
    return API.post('/admin/cache/refresh/pool');
  }).then(function() {
    return loadPool(activePool);
  }).catch(function(e) {
    document.getElementById('content').innerHTML = '<p class="state-error">刷新失败: ' + (e.message || '') + '</p>';
  }).finally(function() {
    btn.disabled = false; btn.textContent = '🔄 刷新';
  });
}

function renderTabs() {
  var html = '';
  pools.forEach(function(p) {
    html += '<button class="tab' + (p.type === activePool ? ' active' : '') + '" onclick="loadPool(\'' + p.type + '\')">' + p.name + '</button>';
  });
  document.getElementById('tabs').innerHTML = html;
}

function loadPool(type) {
  activePool = type;
  renderTabs();
  document.getElementById('statName').textContent = pools.find(function(p) { return p.type === type; }).name;
  var content = document.getElementById('content');
  content.innerHTML = '<p class="state-loading">加载中...</p>';
  API.get('/stock-pool/' + type + getExcludeParams()).then(function(r) {
    allItems = r.data.items || [];
    currentTradeDate = r.data.trade_date || '';
    if (currentTradeDate && currentTradeDate.length === 8) {
      document.getElementById('statDate').textContent = currentTradeDate.substring(0,4) + '-' + currentTradeDate.substring(4,6) + '-' + currentTradeDate.substring(6,8);
    }
    if (!allItems.length) {
      content.innerHTML = '<p class="state-empty">暂无数据 — 请先在<a href="admin-trigger.html">管理后台</a>执行数据同步和选股池计算。</p>';
      return;
    }
    var filtered = filterItems(allItems);
    renderTable(filtered.length ? filtered : allItems);
  }).catch(function(e) {
    content.innerHTML = '<p class="state-error">加载失败: ' + (e.message || '未知错误') + '</p>';
  });
}

function renderTable(items) {
  var content = document.getElementById('content');
  if (!items.length) {
    content.innerHTML = '<p class="state-empty">当前筛选条件下无结果，请调整板块筛选或<a href="#" onclick="doRefresh()">刷新数据</a></p>';
    document.getElementById('statCount').textContent = '0';
    return;
  }
  document.getElementById('statCount').textContent = items.length + ' 条';
  if (currentTradeDate && currentTradeDate.length === 8) {
    document.getElementById('statDate').textContent = currentTradeDate.substring(0,4) + '-' + currentTradeDate.substring(4,6) + '-' + currentTradeDate.substring(6,8);
  }
  var html = '<table class="data-table"><thead><tr><th>排名</th><th>代码</th><th>名称</th><th>收盘价</th><th>涨跌幅</th><th>评分</th><th>入选理由</th><th>自选</th></tr></thead><tbody>';
  items.forEach(function(s, i) {
    var color = s.change_pct > 0 ? 'color:var(--color-danger)' : 'color:var(--color-success)';
    var rowCk = '<td style="cursor:pointer" onclick="location.href=\'diagnosis.html?code=' + encodeURIComponent(s.stock_code) + '\'">';
    html += '<tr>' + rowCk + (i+1) + '</td>' + rowCk + s.stock_code + '</td>' + rowCk + s.stock_name + '</td>' + rowCk + (s.close || '--') + '</td>' + rowCk + '<span style="' + color + '">' + (s.change_pct || '--') + '%</span></td>' + rowCk + '<span style="font-weight:600">' + (s.score != null ? s.score : '--') + '</span></td>' + rowCk + '<span style="font-size:0.75rem;color:var(--color-text-muted)">' + (s.inclusion_reason || '') + '</span></td>';
    html += '<td><button class="spc-fav-btn" data-code="' + s.stock_code + '" onclick="event.stopPropagation();FavStore.toggle(this,\'' + s.stock_code + '\',\'' + (s.stock_name || s.stock_code) + '\')" title="添加自选">+</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
  FavStore._refreshButtons();
}

document.addEventListener('click', function(e) {
  var menu = document.getElementById('filterMenu');
  var btn = document.getElementById('btnFilter');
  if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove('show');
  }
});

FavStore.loadCache();
renderTabs();
loadPool('hot_leader');
</script>
</body>
</html>
