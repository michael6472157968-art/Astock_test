<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=15" />
</head>
<body>
<header class="app-header">
  <div class="header-left"><a href="/"><svg width="24" height="24" viewBox="0 0 24 24" style="display:block"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#00a8e8"/></linearGradient></defs><path d="M4,20 Q3,14 6,11 Q9,8 7,3" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round"/><polyline points="17,18 10,12 13,8 7,3" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-size:1.05rem;font-weight:700;background:linear-gradient(90deg,#00d4aa,#00a8e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Stock <span style="color:#8899aa;background:none;-webkit-text-fill-color:#8899aa">in</span></span></a></div>
</header>
<div class="risk-banner">⚠️ 免责声明：本平台所有分析内容仅供参考，不构成任何投资建议。股市有风险，投资需谨慎。</div>
<main class="main-content">
  <div style="max-width:400px;margin:60px auto">
    <a href="/" style="display:inline-block;margin-bottom:16px;color:var(--color-text-muted);font-size:0.85rem;text-decoration:none">← 返回首页</a>
    <div class="card"><div class="card-header">登录</div><div class="card-body">
      <div class="form-group"><label class="form-label">手机号</label><input class="form-input" id="phone" placeholder="请输入手机号" maxlength="11" /></div>
      <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="password" type="password" placeholder="请输入密码" /></div>
      <div id="error" class="form-error" style="display:none"></div>
      <button class="btn btn-primary btn-block" onclick="doLogin()" style="margin-top:12px">登录</button>
      <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:var(--color-text-muted)">还没有账号？<a href="register.html" style="color:var(--color-primary)">去注册</a></p>
    </div></div>
  </div>
</main>
<footer class="app-footer">【风险提示】本平台所提供市场数据、技术分析、选股结果、诊股报告等内容仅供学习研究参考，不构成投资建议。投资者据此操作，风险自担。</footer>
<script src="/js/app.js?v=18"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var phone = document.getElementById('phone');
  var pwd = document.getElementById('password');
  phone.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { pwd.focus(); e.preventDefault(); }
  });
  pwd.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { doLogin(); e.preventDefault(); }
  });
});

function doLogin() {
  var phone = document.getElementById('phone').value;
  var pwd = document.getElementById('password').value;
  var errEl = document.getElementById('error');
  if (!phone || !pwd) { errEl.textContent = '请填写手机号和密码'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  var btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = '登录中...';
  API.post('/auth/login', { phone: phone, password: pwd }).then(function(r) {
    Session.save(r.data);
    var redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    window.location.href = redirect;
  }).catch(function(e) {
    errEl.textContent = e.message || '登录失败';
    errEl.style.display = 'block';
  }).finally(function() { btn.disabled = false; btn.textContent = '登录'; });
}
</script>
</body>
</html>
