<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stockwin 短线助手</title>
<link rel="stylesheet" href="/css/app.css?v=3" />
</head>
<body>
<main class="main-content" data-chrome>
  <div class="dashboard">

    <!-- 非交易日提示 -->
    <div id="holidayBanner" style="display:none;text-align:center;padding:8px 16px;margin-bottom:12px;background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;font-size:0.82rem;color:var(--color-text-muted);">
      今日休市 · 数据截止 <span id="holidayDate">--</span>
    </div>

    <!-- KPI 指标行 -->
    <div class="kpi-row" id="kpiRow">
      <div class="kpi-card">
        <div class="kpi-label">北向资金净流入</div>
        <div class="kpi-value" id="kpiNorthbound">--</div>
        <div class="kpi-sub" id="kpiNorthboundDate">--</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">全市场成交额</div>
        <div class="kpi-value" id="kpiTurnover">--</div>
        <div class="kpi-sub" id="kpiTurnoverSub">--</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">市场宽度</div>
        <div class="kpi-value" id="kpiBreadth">--</div>
        <div class="kpi-sub" id="kpiBreadthSub">--</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">行业宽度</div>
        <div class="kpi-value" id="kpiIndustryBreadth">--</div>
        <div class="kpi-sub" id="kpiIndustryBreadthSub">--</div>
      </div>
    </div>

    <!-- 指数行情 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
      <h3 style="font-size:0.95rem;font-weight:600;">指数行情</h3>
      <span style="font-size:0.7rem;padding:2px 8px;border-radius:4px;background:var(--color-border);color:var(--color-text-muted);" id="indexSource">--</span>
    </div>
    <div class="index-bar" id="indexBar">
      <div class="index-card"><div class="ic-name">上证指数</div><div class="ic-price">--</div><div class="ic-change flat">--</div></div>
      <div class="index-card"><div class="ic-name">深证成指</div><div class="ic-price">--</div><div class="ic-change flat">--</div></div>
      <div class="index-card"><div class="ic-name">创业板指</div><div class="ic-price">--</div><div class="ic-change flat">--</div></div>
      <div class="index-card"><div class="ic-name">科创50</div><div class="ic-price">--</div><div class="ic-change flat">--</div></div>
    </div>

    <!-- 市场情绪 + 板块热力预览 双栏 -->
    <div class="mid-row">
      <div class="mood-panel" id="moodPanel">
        <div class="mood-header"><span class="mood-title">市场情绪</span><span class="mood-date" id="moodDate">加载中...</span></div>
        <div class="mood-body">
          <div class="mood-left">
            <div class="mood-row">
              <span class="mood-label">上涨</span>
              <div class="mood-bar-wrap"><div class="mood-bar up" id="moodUpBar" style="width:0%"></div></div>
              <span class="mood-count" id="moodUpCount">--</span>
            </div>
            <div class="mood-row">
              <span class="mood-label">下跌</span>
              <div class="mood-bar-wrap"><div class="mood-bar down" id="moodDownBar" style="width:0%"></div></div>
              <span class="mood-count" id="moodDownCount">--</span>
            </div>
            <div class="mood-row">
              <span class="mood-label">平盘</span>
              <div class="mood-bar-wrap"><div class="mood-bar flat" id="moodFlatBar" style="width:0%"></div></div>
              <span class="mood-count" id="moodFlatCount">--</span>
            </div>
          </div>
          <div class="mood-right">
            <div class="mood-limit-item"><div class="ml-num up" id="limitUpCount">--</div><div class="ml-label">涨停</div></div>
            <div class="mood-limit-item"><div class="ml-num down" id="limitDownCount">--</div><div class="ml-label">跌停</div></div>
          </div>
        </div>
      </div>

      <div class="sector-heat-mini" id="sectorHeatMini">
        <div class="mood-header"><span class="mood-title">板块热力</span><a href="sector-rotation.html" class="shm-link">查看全部 →</a></div>
        <div class="shm-grid" id="shmGrid"></div>
      </div>
    </div>

    <!-- 大盘竞猜 -->
    <div class="mood-panel" id="guessPanel" style="margin-bottom:16px;">
      <div class="mood-header"><span class="mood-title">大盘竞猜</span><span class="mood-date" id="guessSubtitle">猜今日涨跌</span></div>
      <div class="mood-body" style="flex-direction:column;align-items:center;padding:16px 20px;" id="guessBody">
        <div style="text-align:center;color:var(--color-text-muted);">加载中...</div>
      </div>
    </div>

    <!-- 热门股票 -->
    <div>
      <h3 style="font-size:0.95rem;font-weight:600;margin-bottom:12px;">热门股票</h3>
      <div class="hot-stock-list" id="hotStocks">
        <div class="hot-stock-card"><div class="hs-info"><div class="hs-name">加载中...</div></div></div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">检查中...</span></span>
      <span class="sep">|</span>
      <span>股票总数: <strong id="statusStockCount">--</strong></span>
      <span class="sep">|</span>
      <span>数据截止: <strong id="statusDataDate">--</strong></span>
      <span class="refresh-hint" id="refreshHint"></span>
    </div>

  </div>
</main>

<!-- Sector Leaders Modal -->
<div class="modal-overlay" id="sectorModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="sectorModalTitle">--</h3>
      <button class="modal-close-btn" onclick="document.getElementById('sectorModal').classList.remove('show')">&times;</button>
    </div>
    <div class="modal-pct" id="sectorModalPct">--</div>
    <div id="sectorModalBody"><div style="text-align:center;padding:30px;color:var(--color-text-muted);">加载中...</div></div>
  </div>
</div>

<script src="/js/app.js?v=5"></script>
<script src="/lib/echarts.js"></script>
<script>
(function() {
  function fmtSign(v) { return v >= 0 ? '+' + v.toFixed(2) : v.toFixed(2); }
  function pctCls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
  function inTradingHours() {
     var d = new Date(); if (d.getDay() === 0 || d.getDay() === 6) return false;
     var m = d.getHours() * 60 + d.getMinutes(); return m >= 540 && m <= 930;
  }
  function fmtDate8(d) { if (!d || d.length !== 8) return d || ''; return d.substring(0,4) + '-' + d.substring(4,6) + '-' + d.substring(6,8); }

  function fmtAmount(v) {
    if (v === undefined || v === null) return '--';
    if (Math.abs(v) >= 1e12) return (v / 1e12).toFixed(2) + ' 万亿';
    if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2) + ' 亿';
    if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + ' 万';
    return v.toFixed(0);
  }

  function checkHolidayBanner(data) {
    var banner = document.getElementById('holidayBanner');
    if (!data || data.is_trade_day === false) {
      var td = (data && data.trade_date) || (data && data.date) || '';
      document.getElementById('holidayDate').textContent = fmtDate8(td);
      banner.style.display = '';
    } else {
      banner.style.display = 'none';
    }
  }

  // ── Dashboard 聚合数据 ──
  function loadDashboard() {
    API.get('/market/dashboard').then(function(r) {
      var d = r.data;
      checkHolidayBanner(d);

      // 北向资金
      var nb = d.northbound;
      var nbEl = document.getElementById('kpiNorthbound');
      var nbDateEl = document.getElementById('kpiNorthboundDate');
      if (nb) {
        var v = nb.net_in || 0;
        nbEl.textContent = (v >= 0 ? '+' : '') + fmtAmount(v);
        nbEl.className = 'kpi-value ' + (v >= 0 ? 'up' : 'down');
        nbDateEl.textContent = fmtDate8(nb.date);
      } else {
        nbEl.textContent = '--'; nbEl.className = 'kpi-value';
        nbDateEl.textContent = '未获取';
      }

      // 成交额
      if (d.turnover !== undefined) {
        document.getElementById('kpiTurnover').textContent = fmtAmount(d.turnover);
        document.getElementById('kpiTurnoverSub').textContent = d.stock_count + ' 只股票';
      }

      // 市场宽度
      if (d.breath !== undefined) {
        var bEl = document.getElementById('kpiBreadth');
        bEl.textContent = d.breath + '%';
        bEl.className = 'kpi-value ' + (d.breath >= 50 ? 'up' : 'down');
        document.getElementById('kpiBreadthSub').textContent = '涨 ' + d.up_stocks + ' / 跌 ' + d.down_stocks;
      }

      // 行业宽度
      if (d.industry_breadth !== undefined) {
        var iEl = document.getElementById('kpiIndustryBreadth');
        iEl.textContent = d.industry_breadth + '%';
        iEl.className = 'kpi-value ' + (d.industry_breadth >= 50 ? 'up' : 'down');
        document.getElementById('kpiIndustryBreadthSub').textContent = '涨 ' + d.industry_up + ' / 跌 ' + (d.industry_down || '0');
      }

      // 板块热力迷你
      var sectors = d.top_sectors || [];
      var grid = document.getElementById('shmGrid');
      if (sectors.length) {
        var maxAbs = Math.max.apply(null, sectors.map(function(s) { return Math.abs(s.pct_chg); })) || 1;
        grid.innerHTML = sectors.map(function(s) {
          var w = Math.round(Math.abs(s.pct_chg) / maxAbs * 100);
          var cls = s.pct_chg >= 0 ? 'shm-cell up' : 'shm-cell down';
          return '<span class="' + cls + '" onclick="showSectorLeaders(\'' + s.name.replace(/'/g, "\\'") + '\', ' + s.pct_chg + ')" title="' + s.name + ' ' + fmtSign(s.pct_chg) + '%">' +
            '<span class="shm-name">' + s.name + '</span>' +
            '<span class="shm-pct">' + fmtSign(s.pct_chg) + '%</span>' +
            '<span class="shm-bar" style="width:' + w + '%"></span>' +
            '</span>';
        }).join('');
      }
    }).catch(function() {});
  }

  function loadIndices() {
    API.get('/market/index').then(function(r) {
      var d = r.data;
      checkHolidayBanner(d);
      var indices = d.indices || [];
      var cards = document.querySelectorAll('.index-card');
      indices.forEach(function(idx, i) {
        if (i >= cards.length) return;
        cards[i].querySelector('.ic-price').textContent = idx.close.toLocaleString();
        var chg = cards[i].querySelector('.ic-change');
        chg.innerHTML = fmtSign(idx.pct_chg) + '% <span style="font-size:0.75rem;opacity:0.8">' + fmtSign(idx.change) + '</span>';
        chg.className = 'ic-change ' + pctCls(idx.pct_chg);
      });
      var badge = document.getElementById('indexSource');
      if (badge) {
        var src = d.source || '';
        if (src === 'tushare') badge.textContent = '收盘';
        else if (src === 'none') badge.textContent = '无';
        else badge.textContent = src || '--';
      }
      var tradeDate = d.trade_date || d.date || '';
      document.getElementById('statusDataDate').textContent = fmtDate8(tradeDate);
    }).catch(function() {});
  }

  function loadMood() {
    API.get('/market/mood').then(function(r) {
      var d = r.data;
      checkHolidayBanner(d);
      var total = d.up + d.down + d.flat || 1;
      document.getElementById('moodUpCount').textContent = d.up;
      document.getElementById('moodDownCount').textContent = d.down;
      document.getElementById('moodFlatCount').textContent = d.flat;
      document.getElementById('moodUpBar').style.width = (d.up / total * 100).toFixed(1) + '%';
      document.getElementById('moodDownBar').style.width = (d.down / total * 100).toFixed(1) + '%';
      document.getElementById('moodFlatBar').style.width = (d.flat / total * 100).toFixed(1) + '%';
      document.getElementById('limitUpCount').textContent = d.limit_up;
      document.getElementById('limitDownCount').textContent = d.limit_down;
      document.getElementById('moodDate').textContent = d.date ? '数据截止 ' + fmtDate8(d.date) : '';
    }).catch(function() {});
  }

  function renderSparkline(container, tsCode, pctChg) {
    var el = typeof container === 'string' ? document.getElementById(container) : container;
    if (!el) return;
    var c = pctChg >= 0 ? '#ef4444' : '#22c55e';
    var h = Math.min(Math.abs(pctChg) * 2.5, 30); h = Math.max(h, 4);
    el.innerHTML = '<div style="display:flex;align-items:flex-end;gap:2px;height:36px;justify-content:center">' +
      Array.from({length:5}, function(_, i) {
        var barH = h * (0.4 + Math.random() * 0.6);
        return '<div style="width:10px;height:' + barH + 'px;background:' + c + ';border-radius:2px;opacity:' + (0.3 + i*0.17) + '"></div>';
      }).join('') + '</div>';
  }

  function loadHotStocks() {
    API.get('/stock-pool/hot_leader').then(function(r) {
      var items = r.data.items || [];
      checkHolidayBanner(r.data);
      if (!items.length) {
        document.getElementById('hotStocks').innerHTML = '<div class="hot-stock-card"><div class="hs-info"><div class="hs-name">暂无数据</div></div></div>';
        return;
      }
      var top4 = items.slice(0, 4);
      var html = '';
      top4.forEach(function(s, idx) {
        var tsCode = s.stock_code || s.ts_code || '';
        var name = s.stock_name || s.name || tsCode;
        var close = s.close !== undefined ? s.close : 0;
        var pct = s.change_pct !== undefined ? s.change_pct : (s.pct_chg !== undefined ? s.pct_chg : 0);
        var chartId = 'spark_' + idx;
        html += '<div class="hot-stock-card" onclick="window.location.href=\'diagnosis.html?code=' + encodeURIComponent(tsCode) + '\'">' +
          '<div class="hs-info"><div class="hs-name">' + name + '</div><div class="hs-code">' + tsCode + '</div>' +
          '<div class="hs-price">' + (close ? close.toFixed(2) : '--') + ' <span class="hs-pct ' + pctCls(pct) + '">' + fmtSign(pct) + '%</span></div></div>' +
          '<div class="hs-chart" id="' + chartId + '"></div></div>';
      });
      document.getElementById('hotStocks').innerHTML = html;
      top4.forEach(function(s, idx) {
        var el = document.getElementById('spark_' + idx);
        if (el) renderSparkline(el, s.stock_code || s.ts_code, s.change_pct !== undefined ? s.change_pct : (s.pct_chg !== undefined ? s.pct_chg : 0));
      });
    }).catch(function() {
      document.getElementById('hotStocks').innerHTML = '<div class="hot-stock-card"><div class="hs-info"><div class="hs-name">数据加载失败</div></div></div>';
    });
  }

  // ── Sector Leaders Modal ──
  function showSectorLeaders(name, pct) {
    var overlay = document.getElementById('sectorModal');
    document.getElementById('sectorModalTitle').textContent = name;
    var pctEl = document.getElementById('sectorModalPct');
    pctEl.textContent = fmtSign(pct) + '%';
    pctEl.className = 'modal-pct ' + (pct > 0 ? 'up' : pct < 0 ? 'down' : '');
    document.getElementById('sectorModalBody').innerHTML = '<div style="text-align:center;padding:30px;color:var(--color-text-muted);">正在加载 ' + name + ' 领涨股...</div>';
    overlay.classList.add('show');

    API.get('/sector/' + encodeURIComponent(name) + '/leaders').then(function(r) {
      var stocks = r.data.stocks || [];
      var sname = r.data.sector_name || name;
      document.getElementById('sectorModalTitle').textContent = sname;
      if (!stocks.length) {
        document.getElementById('sectorModalBody').innerHTML = '<div style="text-align:center;padding:30px;color:var(--color-text-muted);">暂无该板块成分股数据</div>';
        return;
      }
      var html = '<table class="leader-table modal-fade-in"><thead><tr><th>#</th><th>股票名称</th><th>最新价</th><th>涨跌幅</th></tr></thead><tbody>';
      stocks.forEach(function(s, i) {
        var pctCls = s.pct_chg > 0 ? 'up' : s.pct_chg < 0 ? 'down' : 'flat';
        html += '<tr><td style="color:var(--color-text-muted)">' + (i + 1) + '</td>'
          + '<td><a class="stock-link" href="diagnosis.html?code=' + encodeURIComponent(s.ts_code || '') + '">' + (s.name || s.ts_code) + '</a></td>'
          + '<td>' + (s.close ? s.close.toFixed(2) : '--') + '</td>'
          + '<td class="pct ' + pctCls + '">' + fmtSign(s.pct_chg) + '%</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('sectorModalBody').innerHTML = html;
    }).catch(function(e) {
      document.getElementById('sectorModalBody').innerHTML = '<div style="text-align:center;padding:30px;color:var(--color-danger);">加载失败: ' + (e.message || '请重试') + '</div>';
    });
  }

  window.showSectorLeaders = showSectorLeaders;

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('sectorModal').classList.remove('show');
  });

  function updateHealth() {
    API.get('/health').then(function(r) {
      var ok = r.data && (r.data.app || r.code === 200);
      var dot = document.getElementById('statusDot'), txt = document.getElementById('statusText');
      if (dot && txt) {
        if (ok) { dot.className = 'status-dot ok'; txt.textContent = '服务器正常'; }
        else { dot.className = 'status-dot err'; txt.textContent = '服务器异常'; }
      }
    }).catch(function() {
      var dot = document.getElementById('statusDot'), txt = document.getElementById('statusText');
      if (dot) dot.className = 'status-dot err'; if (txt) txt.textContent = '服务器异常';
    });
  }
  function loadStockCount() {
    API.get('/market/stock_count').then(function(r) {
      document.getElementById('statusStockCount').textContent = (r.data.count || 0) + ' 只';
    }).catch(function() { document.getElementById('statusStockCount').textContent = '--'; });
  }

  var indexTimer = null;
  function autoRefresh() {
    updateHealth(); loadStockCount();
    loadDashboard();
    if (inTradingHours()) {
      loadIndices(); loadMood();
      document.getElementById('refreshHint').textContent = '交易时段 | 60s 刷新';
      indexTimer = setInterval(function() {
        if (!inTradingHours()) { clearInterval(indexTimer); document.getElementById('refreshHint').textContent = '非交易时段'; return; }
        loadIndices(); loadMood(); loadDashboard();
      }, 60000);
    } else {
      document.getElementById('refreshHint').textContent = '非交易时段';
    }
  }

  loadIndices(); loadMood(); loadHotStocks(); loadMarketGuess(); autoRefresh();
  setInterval(function() { updateHealth(); }, 30000);

  // ── 大盘竞猜 ──
  function loadMarketGuess() {
    var body = document.getElementById('guessBody');
    var subtitle = document.getElementById('guessSubtitle');
    if (!Session.loggedIn()) {
      body.innerHTML = '<div style="text-align:center;color:var(--color-text-muted);padding:8px;"><a href="login.html">登录</a>后参与竞猜，猜对+5积分</div>';
      return;
    }
    API.get('/credits/guess/status').then(function(r) {
      var d = r.data;
      if (!d.target_date) {
        body.innerHTML = '<div style="text-align:center;color:var(--color-text-muted);padding:8px;">暂无交易日可竞猜</div>';
        return;
      }
      if (d.has_guessed) {
        var dirLabel = d.direction === 'up' ? '📈 看涨' : '📉 看跌';
        var settledText = '';
        if (d.settled) {
          settledText = d.score_change >= 5
            ? ' <span style="color:var(--color-success);">猜对+5!</span>'
            : ' <span style="color:var(--color-text-muted);">参与+1</span>';
        } else {
          settledText = ' <span style="color:var(--color-text-muted);">待结算</span>';
        }
        body.innerHTML = '<div style="text-align:center;padding:8px;">' + dirLabel + settledText + '</div>';
        subtitle.textContent = '目标日 ' + d.target_date;
      } else {
        body.innerHTML =
          '<div style="display:flex;gap:12px;justify-content:center;padding:8px;">' +
          '<button class="btn btn-sm" style="background:#ef444420;color:#ef4444;border:1px solid #ef4444;font-weight:700;" onclick="submitGuess(\'up\')">📈 看涨</button>' +
          '<button class="btn btn-sm" style="background:#22c55e20;color:#22c55e;border:1px solid #22c55e;font-weight:700;" onclick="submitGuess(\'down\')">📉 看跌</button>' +
          '</div>';
        subtitle.textContent = '猜下一交易日 (' + d.target_date + ') · 猜对+5 · 参与+1';
      }
    }).catch(function() {
      body.innerHTML = '<div style="text-align:center;color:var(--color-text-muted);">竞猜暂不可用</div>';
    });
  }

  function submitGuess(dir) {
    var btns = document.querySelectorAll('#guessBody button');
    var label = dir === 'up' ? '📈 看涨' : '📉 看跌';
    btns.forEach(function(b) {
      b.disabled = true;
      b.style.opacity = '0.5';
      b.style.transition = 'all 0.2s';
    });
    // 点击的按钮高亮闪烁
    var active = dir === 'up' ? btns[0] : btns[1];
    active.style.opacity = '1';
    active.style.transform = 'scale(1.08)';
    active.textContent = '⏳ 提交中...';
    API.post('/credits/guess?direction=' + dir).then(function() {
      // 成功弹跳动画
      active.textContent = '✅ 已提交';
      active.style.transform = 'scale(1.15)';
      active.style.background = dir === 'up' ? '#ef4444' : '#22c55e';
      active.style.color = '#fff';
      setTimeout(function() {
        loadMarketGuess();
      }, 600);
    }).catch(function(e) {
      btns.forEach(function(b) {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.transform = 'scale(1)';
      });
      active.textContent = label;
      showToast(e.message || '提交失败');
    });
  }

  window.submitGuess = submitGuess;
})();
</script>
</body>
</html>
