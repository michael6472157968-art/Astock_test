<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理后台 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=12" />
<style>
.admin-tabs { display:flex; gap:0; border-bottom:2px solid var(--color-border); margin-bottom:20px; }
.admin-tab { padding:8px 20px; cursor:pointer; font-size:0.9rem; color:var(--color-text-muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all 0.2s; }
.admin-tab:hover { color:var(--color-text); }
.admin-tab.active { color:var(--color-primary); border-bottom-color:var(--color-primary); font-weight:600; }
.admin-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
.admin-table th { text-align:left; padding:8px 12px; border-bottom:2px solid var(--color-border); color:var(--color-text-muted); font-weight:600; background:var(--color-bg-secondary); }
.admin-table td { padding:8px 12px; border-bottom:1px solid var(--color-border); }
.admin-table tr:hover td { background:var(--color-bg-secondary); }
.pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:16px; }
.pager button { padding:4px 12px; font-size:0.8rem; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:var(--color-card); border-radius:8px; padding:20px; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-close-btn { background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--color-text-muted); }
.user-detail-section { margin-bottom:16px; }
.user-detail-section h4 { font-size:0.85rem; color:var(--color-text-muted); margin-bottom:8px; border-bottom:1px solid var(--color-border); padding-bottom:4px; }
.action-btn-sm { padding:2px 8px; font-size:0.75rem; margin-right:4px; }
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">管理后台</h2>

  <div class="admin-tabs">
    <span class="admin-tab active" data-tab="users">用户管理</span>
    <span class="admin-tab" data-tab="codes">激活码</span>
    <span class="admin-tab" data-tab="sync">数据同步</span>
    <span class="admin-tab" data-tab="stats">统计概览</span>
  </div>

  <!-- 用户管理 -->
  <div id="tab-users">
    <div class="stat-grid" id="userStats" style="margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
      <input class="form-input" id="userSearch" placeholder="手机号搜索..." style="max-width:180px" onkeypress="if(event.key==='Enter')loadUsers()" />
      <select class="form-input" id="tierFilter" style="max-width:130px" onchange="loadUsers()">
        <option value="">全部等级</option>
        <option value="1">免费用户</option>
        <option value="2">月VIP</option>
        <option value="3">年VIP</option>
        <option value="99">管理员</option>
      </select>
      <button class="btn btn-sm btn-primary" onclick="loadUsers()">搜索</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="userTable">
        <thead><tr><th>ID</th><th>手机号</th><th>等级</th><th>积分</th><th>状态</th><th>会员到期</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="userTbody"></tbody>
      </table>
    </div>
    <div class="pager" id="userPager"></div>
  </div>

  <!-- 激活码 -->
  <div id="tab-codes" style="display:none;">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
      <select class="form-input" id="codeType" style="max-width:120px"><option value="monthly">月卡</option><option value="annual">年卡</option></select>
      <input class="form-input" id="codeCount" type="number" value="10" min="1" max="200" style="max-width:80px" />
      <button class="btn btn-sm btn-primary" onclick="genCodes()">生成激活码</button>
      <button class="btn btn-sm btn-outline" onclick="loadCodes()">刷新列表</button>
    </div>
    <div id="genResult" style="margin-bottom:12px;"></div>
    <table class="admin-table" id="codeTable">
      <thead><tr><th>ID</th><th>激活码</th><th>类型</th><th>状态</th><th>使用者</th><th>生成时间</th><th>使用时间</th></tr></thead>
      <tbody id="codeTbody"></tbody>
    </table>
  </div>

  <!-- 数据同步 -->
  <div id="tab-sync" style="display:none;">
    <div class="stat-grid" style="margin-bottom:20px;" id="syncStats"></div>
    <div class="card" style="margin-bottom:12px"><div class="card-header">数据同步</div><div class="card-body">
      <p style="margin-bottom:10px;font-size:0.82rem;color:var(--color-text-muted);">从 Tushare 拉取最新股票基础信息与日线数据。</p>
      <button class="btn btn-primary" onclick="syncData()">同步股票+日线数据</button>
      <button class="btn btn-outline" style="margin-left:8px;" onclick="syncHistorical()">同步历史120天</button>
      <p id="syncMsg" style="margin-top:8px;font-size:0.8rem;"></p>
    </div></div>
    <div class="card" style="margin-bottom:12px"><div class="card-header">离线计算</div><div class="card-body">
      <button class="btn btn-primary" onclick="refreshPool()">更新选股池</button>
      <button class="btn btn-outline" style="margin-left:8px;" onclick="refreshSector()">重新计算板块</button>
      <button class="btn btn-outline" style="margin-left:8px;" onclick="refreshReview()">重新生成复盘</button>
      <button class="btn btn-outline" style="margin-left:8px;" onclick="refreshRisk()">重新扫描风险</button>
      <p id="poolMsg" style="margin-top:8px;font-size:0.8rem;"></p>
    </div></div>
    <div class="card"><div class="card-header">缓存管理</div><div class="card-body">
      <button class="btn btn-sm btn-outline" onclick="loadCacheStats()">刷新缓存统计</button>
      <button class="btn btn-sm" style="background:#dc262620;color:var(--color-danger);border:1px solid var(--color-danger);margin-left:8px;" onclick="clearAllCache()">清空全部缓存</button>
      <p id="cacheMsg" style="margin-top:8px;font-size:0.8rem;"></p>
    </div></div>
  </div>

  <!-- 统计概览 -->
  <div id="tab-stats" style="display:none;">
    <div class="stat-grid" id="adminStats" style="margin-bottom:20px;"></div>
  </div>

  <!-- 用户详情弹窗 -->
  <div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="detailTitle">用户详情</h3>
        <button class="modal-close-btn" onclick="closeDetail()">&times;</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- 操作弹窗 -->
  <div class="modal-overlay" id="actionModal" onclick="if(event.target===this)closeAction()">
    <div class="modal-box" onclick="event.stopPropagation()" style="max-width:400px;">
      <div class="modal-header">
        <h3 id="actionTitle">操作</h3>
        <button class="modal-close-btn" onclick="closeAction()">&times;</button>
      </div>
      <div id="actionBody"></div>
    </div>
  </div>
</main>

<script src="/js/app.js?v=13"></script>
<script>
(function() {
  var currentPage = 1;
  var currentUserId = null;

  // Tab switching
  document.querySelectorAll('.admin-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('.admin-tab').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      var tab = t.dataset.tab;
      ['users','codes','sync','stats'].forEach(function(id) {
        document.getElementById('tab-' + id).style.display = id === tab ? '' : 'none';
      });
      if (tab === 'users') { loadUserStats(); loadUsers(); }
      if (tab === 'codes') loadCodes();
      if (tab === 'sync') { loadCacheStats(); loadSyncStats(); }
      if (tab === 'stats') loadAdminStats();
    });
  });

  // ── User Management ──
  function loadUserStats() {
    API.get('/admin/users/stats').then(function(r) {
      var d = r.data;
      var html = '';
      html += '<div class="stat-card"><div class="stat-label">总用户</div><div class="stat-value" style="font-size:1.1rem;">' + d.total_users + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">今日新增</div><div class="stat-value" style="font-size:1.1rem;">' + d.today_new + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">本周新增</div><div class="stat-value" style="font-size:1.1rem;">' + d.week_new + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">今日诊股</div><div class="stat-value" style="font-size:1.1rem;">' + d.today_diagnosis_count + '</div></div>';
      document.getElementById('userStats').innerHTML = html;
    }).catch(function() {});
  }

  function loadUsers(page) {
    page = page || currentPage;
    currentPage = page;
    var search = document.getElementById('userSearch').value.trim();
    var tier = document.getElementById('tierFilter').value;
    var params = 'page=' + page + '&page_size=20';
    if (search) params += '&search=' + encodeURIComponent(search);
    if (tier) params += '&tier_filter=' + tier;

    API.get('/admin/users?' + params).then(function(r) {
      var d = r.data;
      var html = '';
      (d.items || []).forEach(function(u) {
        var tierLabel = {0:'游客',1:'免费',2:'月VIP',3:'年VIP',99:'管理员'}[u.tier] || u.tier;
        var statusCls = u.is_active ? 'color:var(--color-success);' : 'color:var(--color-danger);';
        var statusLabel = u.is_active ? '正常' : '禁用';
        html += '<tr>' +
          '<td>' + u.id + '</td>' +
          '<td>' + u.phone_masked + '</td>' +
          '<td>' + tierLabel + '</td>' +
          '<td>' + u.credits + '</td>' +
          '<td><span style="' + statusCls + '">' + statusLabel + '</span></td>' +
          '<td>' + (u.member_expire ? u.member_expire.substring(0,10) : '--') + '</td>' +
          '<td>' + (u.created_at ? u.created_at.substring(0,10) : '--') + '</td>' +
          '<td>' +
            '<button class="btn btn-sm action-btn-sm" onclick="viewDetail(' + u.id + ')">详情</button>' +
            '<button class="btn btn-sm action-btn-sm" onclick="showCreditAdjust(' + u.id + ')">积分</button>' +
            '<button class="btn btn-sm action-btn-sm" onclick="showTierAdjust(' + u.id + ')">等级</button>' +
            '<button class="btn btn-sm action-btn-sm" onclick="toggleActive(' + u.id + ')">' + (u.is_active ? '禁用' : '启用') + '</button>' +
          '</td>' +
        '</tr>';
      });
      document.getElementById('userTbody').innerHTML = html || '<tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);">无数据</td></tr>';

      var totalPages = Math.ceil(d.total / d.page_size) || 1;
      var pagerHtml = '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="loadUsers(' + (page - 1) + ')">上一页</button>';
      pagerHtml += '<span style="font-size:0.8rem;color:var(--color-text-muted);">' + page + ' / ' + totalPages + ' (共' + d.total + '条)</span>';
      pagerHtml += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="loadUsers(' + (page + 1) + ')">下一页</button>';
      document.getElementById('userPager').innerHTML = pagerHtml;
    }).catch(function() {});
  }

  window.loadUsers = loadUsers;

  function viewDetail(uid) {
    currentUserId = uid;
    API.get('/admin/users/' + uid).then(function(r) {
      var d = r.data;
      var u = d.user;
      var tierLabel = {0:'游客',1:'免费用户',2:'月度VIP',3:'年度VIP',99:'管理员'}[u.tier] || u.tier;
      var html = '<div class="user-detail-section">';
      html += '<h4>基本信息</h4>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.82rem;">';
      html += '<div>ID: ' + u.id + '</div><div>手机: ' + u.phone_masked + '</div>';
      html += '<div>等级: ' + tierLabel + '</div><div>积分: ' + u.credits + '</div>';
      html += '<div>状态: ' + (u.is_active ? '正常' : '已禁用') + '</div>';
      html += '<div>会员到期: ' + (u.member_expire ? u.member_expire.substring(0,10) : '无') + '</div>';
      html += '<div>注册: ' + (u.created_at ? u.created_at.substring(0,10) : '--') + '</div><div></div>';
      html += '</div></div>';

      html += '<div class="user-detail-section"><h4>诊股统计</h4>';
      html += '<div style="font-size:0.82rem;">诊股次数: ' + d.diagnosis_stats.total + ' | AI分析次数: ' + d.diagnosis_stats.ai_analysis + '</div>';
      html += '<div style="font-size:0.82rem;">竞猜: ' + d.guess_stats.total + '次, 猜对: ' + d.guess_stats.correct + '次</div>';
      html += '</div>';

      html += '<div class="user-detail-section"><h4>签到日历（近30天）</h4>';
      html += '<div style="display:flex;gap:4px;flex-wrap:wrap;font-size:0.78rem;">';
      var dates = d.checkin_dates.map(function(x) { return x.date; });
      for (var i = 0; i < 30; i++) {
        var dt = new Date();
        dt.setDate(dt.getDate() - i);
        var ds = dt.toISOString().substring(0,10);
        var checked = dates.indexOf(ds) >= 0;
        html += '<span style="width:32px;height:32px;line-height:32px;text-align:center;border-radius:4px;' +
          (checked ? 'background:var(--color-success);color:#fff;' : 'background:var(--color-bg-secondary);color:var(--color-text-muted);') +
          '">' + dt.getDate() + '</span>';
      }
      html += '</div></div>';

      html += '<div class="user-detail-section"><h4>积分流水（最近50条）</h4>';
      html += '<table class="admin-table"><thead><tr><th>类型</th><th>金额</th><th>余额</th><th>备注</th><th>时间</th></tr></thead><tbody>';
      (d.ledger || []).forEach(function(l) {
        var typeLabel = {register:'注册',checkin:'签到',activation:'激活',guess:'竞猜',diagnosis:'诊股',ai_analysis:'AI分析',admin:'管理'}[l.type] || l.type;
        var amtCls = l.amount > 0 ? 'color:var(--color-success);' : 'color:var(--color-danger);';
        html += '<tr><td>' + typeLabel + '</td><td style="' + amtCls + '">' + (l.amount > 0 ? '+' : '') + l.amount + '</td><td>' + l.balance_after + '</td><td>' + (l.note || '') + '</td><td>' + (l.created_at ? l.created_at.substring(0,16) : '--') + '</td></tr>';
      });
      html += '</tbody></table></div>';

      if (d.member_history.length) {
        html += '<div class="user-detail-section"><h4>会员历史</h4>';
        html += '<table class="admin-table"><thead><tr><th>积分</th><th>备注</th><th>时间</th></tr></thead><tbody>';
        d.member_history.forEach(function(m) {
          html += '<tr><td>+' + m.amount + '</td><td>' + (m.note || '') + '</td><td>' + (m.created_at ? m.created_at.substring(0,16) : '--') + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }

      document.getElementById('detailTitle').textContent = '用户 #' + u.id + ' 详情';
      document.getElementById('detailBody').innerHTML = html;
      document.getElementById('detailModal').classList.add('show');
    }).catch(function(e) {
      showToast(e.message || '加载失败');
    });
  }

  window.viewDetail = viewDetail;
  window.closeDetail = function() { document.getElementById('detailModal').classList.remove('show'); };

  function showCreditAdjust(uid) {
    currentUserId = uid;
    document.getElementById('actionTitle').textContent = '调整积分 (用户#' + uid + ')';
    document.getElementById('actionBody').innerHTML =
      '<div style="margin-bottom:10px;"><label style="font-size:0.82rem;">积分变动（正数增加，负数减少）</label>' +
      '<input class="form-input" id="creditAmount" type="number" style="width:100%;margin-top:4px;" /></div>' +
      '<div style="margin-bottom:14px;"><label style="font-size:0.82rem;">备注（必填）</label>' +
      '<input class="form-input" id="creditNote" style="width:100%;margin-top:4px;" placeholder="调整原因..." /></div>' +
      '<button class="btn btn-primary" onclick="doAdjustCredits()">确认调整</button>' +
      '<p id="actionMsg" style="margin-top:8px;font-size:0.8rem;"></p>';
    document.getElementById('actionModal').classList.add('show');
  }
  window.showCreditAdjust = showCreditAdjust;

  function doAdjustCredits() {
    var amount = parseInt(document.getElementById('creditAmount').value);
    var note = document.getElementById('creditNote').value.trim();
    if (isNaN(amount) || amount === 0) { document.getElementById('actionMsg').textContent = '请输入有效的积分变动值'; return; }
    if (!note) { document.getElementById('actionMsg').textContent = '备注不能为空'; return; }
    API.post('/admin/users/' + currentUserId + '/credits', { amount: amount, note: note }).then(function(r) {
      document.getElementById('actionMsg').innerHTML = '<span style="color:var(--color-success);">调整成功，余额: ' + r.data.credits + '</span>';
      setTimeout(function() { closeAction(); loadUsers(); }, 1200);
    }).catch(function(e) { document.getElementById('actionMsg').textContent = e.message || '操作失败'; });
  }
  window.doAdjustCredits = doAdjustCredits;

  function showTierAdjust(uid) {
    currentUserId = uid;
    document.getElementById('actionTitle').textContent = '调整等级 (用户#' + uid + ')';
    document.getElementById('actionBody').innerHTML =
      '<div style="margin-bottom:10px;"><label style="font-size:0.82rem;">等级</label>' +
      '<select class="form-input" id="tierVal" style="width:100%;margin-top:4px;">' +
        '<option value="1">免费用户</option><option value="2">月度VIP</option><option value="3">年度VIP</option><option value="99">管理员</option>' +
      '</select></div>' +
      '<div style="margin-bottom:14px;"><label style="font-size:0.82rem;">会员到期日（可选，留空为无期限）</label>' +
      '<input class="form-input" id="memberExp" type="date" style="width:100%;margin-top:4px;" /></div>' +
      '<button class="btn btn-primary" onclick="doAdjustTier()">确认调整</button>' +
      '<p id="actionMsg" style="margin-top:8px;font-size:0.8rem;"></p>';
    document.getElementById('actionModal').classList.add('show');
  }
  window.showTierAdjust = showTierAdjust;

  function doAdjustTier() {
    var tier = parseInt(document.getElementById('tierVal').value);
    var expire = document.getElementById('memberExp').value || null;
    API.post('/admin/users/' + currentUserId + '/tier', { tier: tier, member_expire: expire }).then(function(r) {
      document.getElementById('actionMsg').innerHTML = '<span style="color:var(--color-success);">调整成功</span>';
      setTimeout(function() { closeAction(); loadUsers(); }, 1200);
    }).catch(function(e) { document.getElementById('actionMsg').textContent = e.message || '操作失败'; });
  }
  window.doAdjustTier = doAdjustTier;

  function toggleActive(uid) {
    if (!confirm('确认' + (event.target.textContent) + '此账号？')) return;
    API.post('/admin/users/' + uid + '/toggle-active').then(function() {
      loadUsers();
    }).catch(function(e) { showToast(e.message); });
  }
  window.toggleActive = toggleActive;

  window.closeAction = function() { document.getElementById('actionModal').classList.remove('show'); };

  // ── Activation Codes ──
  function loadCodes() {
    API.get('/admin/membership/codes').then(function(r) {
      var html = '';
      (r.data.items || []).forEach(function(c) {
        var typeLabel = c.code_type === 'annual' ? '年卡' : '月卡';
        var statusLabel = c.is_used ? '<span style="color:var(--color-text-muted);">已使用</span>' : '<span style="color:var(--color-success);">未使用</span>';
        html += '<tr>' +
          '<td>' + c.id + '</td><td><code>' + c.code + '</code></td><td>' + typeLabel + '</td><td>' + statusLabel + '</td>' +
          '<td>' + (c.used_by || '--') + '</td><td>' + (c.created_at ? c.created_at.substring(0,16) : '--') + '</td>' +
          '<td>' + (c.used_at ? c.used_at.substring(0,16) : '--') + '</td></tr>';
      });
      document.getElementById('codeTbody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;color:var(--color-text-muted);">无数据</td></tr>';
    });
  }

  function genCodes() {
    var type = document.getElementById('codeType').value;
    var count = parseInt(document.getElementById('codeCount').value) || 10;
    var btn = document.querySelector('#tab-codes .btn-primary');
    btn.disabled = true; btn.textContent = '生成中...';
    API.post('/admin/membership/codes', { code_type: type, count: count }).then(function(r) {
      var codes = r.data.codes || [];
      document.getElementById('genResult').innerHTML = '<div class="card" style="border-left:4px solid var(--color-success);padding:12px;"><strong>生成 ' + codes.length + ' 个' + (type==='annual'?'年卡':'月卡') + '激活码：</strong><br>' +
        codes.map(function(c) { return '<code style="margin:2px;">' + c + '</code>'; }).join(' ') + '</div>';
      loadCodes();
    }).catch(function(e) {
      document.getElementById('genResult').innerHTML = '<p style="color:var(--color-danger);">生成失败: ' + (e.message || '') + '</p>';
    }).finally(function() { btn.disabled = false; btn.textContent = '生成激活码'; });
  }

  window.genCodes = genCodes;
  window.loadCodes = loadCodes;

  // ── Data Sync ──
  function loadSyncStats() {
    API.get('/admin/tushare/stats').then(function(r) {
      document.getElementById('syncStats').innerHTML =
        '<div class="stat-card"><div class="stat-label">今日Tushare调用</div><div class="stat-value" style="font-size:1rem;">' + r.data.daily_calls + ' / ' + r.data.daily_limit + '</div></div>';
    }).catch(function() {});
  }

  function loadCacheStats() {
    API.get('/admin/cache/stats').then(function(r) {
      document.getElementById('cacheMsg').textContent = '缓存键: ' + r.data.total_keys + ' (永久: ' + r.data.permanent + ', TTL: ' + r.data.with_ttl + ')';
    }).catch(function() {});
  }

  function syncData() {
    var btn = document.querySelector('#tab-sync .btn-primary');
    btn.disabled = true; btn.textContent = '同步中...';
    document.getElementById('syncMsg').textContent = '同步中（约30秒）...';
    API.post('/admin/tasks/run-daily-batch').then(function(r) {
      var msg = '完成：' + r.data.stock_synced + ' 只股票, ' + r.data.daily_synced + ' 条日线';
      if (r.data.warnings && r.data.warnings.length > 0) {
        msg += '<br>⚠ ' + r.data.warnings.join('<br>⚠ ');
        document.getElementById('syncMsg').innerHTML = msg;
      } else {
        document.getElementById('syncMsg').textContent = msg;
      }
      loadSyncStats();
    }).catch(function(e) {
      document.getElementById('syncMsg').textContent = '失败: ' + (e.message || '');
    }).finally(function() { btn.disabled = false; btn.textContent = '同步股票+日线数据'; });
  }
  window.syncData = syncData;

  function syncHistorical() {
    var btn = document.querySelector('#tab-sync .btn-outline');
    btn.disabled = true; btn.textContent = '同步中...';
    document.getElementById('syncMsg').textContent = '同步历史120天（较慢）...';
    API.post('/admin/tasks/sync-historical').then(function(r) {
      document.getElementById('syncMsg').textContent = '完成: ' + JSON.stringify(r.data);
    }).catch(function(e) {
      document.getElementById('syncMsg').textContent = '失败: ' + (e.message || '');
    }).finally(function() { btn.disabled = false; btn.textContent = '同步历史120天'; });
  }
  window.syncHistorical = syncHistorical;

  function refreshPool() {
    document.getElementById('poolMsg').textContent = '计算中...';
    API.post('/admin/cache/refresh/pool').then(function() {
      document.getElementById('poolMsg').textContent = '选股池已刷新';
    }).catch(function(e) { document.getElementById('poolMsg').textContent = '失败: ' + (e.message || ''); });
  }
  window.refreshPool = refreshPool;

  function refreshSector() {
    document.getElementById('poolMsg').textContent = '计算中...';
    API.post('/admin/cache/refresh/sector').then(function() {
      document.getElementById('poolMsg').textContent = '板块分析已刷新';
    }).catch(function(e) { document.getElementById('poolMsg').textContent = '失败: ' + (e.message || ''); });
  }
  window.refreshSector = refreshSector;

  function refreshReview() {
    document.getElementById('poolMsg').textContent = '生成中...';
    API.post('/admin/cache/refresh/review').then(function() {
      document.getElementById('poolMsg').textContent = '复盘已刷新';
    }).catch(function(e) { document.getElementById('poolMsg').textContent = '失败: ' + (e.message || ''); });
  }
  window.refreshReview = refreshReview;

  function refreshRisk() {
    document.getElementById('poolMsg').textContent = '扫描中...';
    API.post('/admin/cache/refresh/risk').then(function() {
      document.getElementById('poolMsg').textContent = '风险扫描已刷新';
    }).catch(function(e) { document.getElementById('poolMsg').textContent = '失败: ' + (e.message || ''); });
  }
  window.refreshRisk = refreshRisk;

  function clearAllCache() {
    if (!confirm('确认清空全部缓存？')) return;
    API.post('/admin/cache/clear-all').then(function() {
      document.getElementById('cacheMsg').textContent = '缓存已清空';
      loadCacheStats();
    }).catch(function(e) { document.getElementById('cacheMsg').textContent = '失败: ' + (e.message || ''); });
  }
  window.clearAllCache = clearAllCache;
  window.loadCacheStats = loadCacheStats;
  window.loadSyncStats = loadSyncStats;

  // ── Stats Overview ──
  function loadAdminStats() {
    API.get('/admin/users/stats').then(function(r) {
      var d = r.data;
      var html = '';
      html += '<div class="stat-card"><div class="stat-label">总用户</div><div class="stat-value">' + d.total_users + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">今日新增</div><div class="stat-value">' + d.today_new + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">本周新增</div><div class="stat-value">' + d.week_new + '</div></div>';
      html += '<div class="stat-card"><div class="stat-label">今日诊股</div><div class="stat-value">' + d.today_diagnosis_count + '</div></div>';
      document.getElementById('adminStats').innerHTML = html +
        '<div class="stat-card"><div class="stat-label">等级分布</div><div style="font-size:0.8rem;margin-top:4px;">' +
          Object.keys(d.tier_distribution).map(function(t) {
            var label = {0:'游客',1:'免费',2:'月VIP',3:'年VIP',99:'管理员'}[t] || t;
            return label + ': ' + d.tier_distribution[t];
          }).join(' | ') + '</div></div>';
    }).catch(function() {});
  }

  // Init
  loadUserStats(); loadUsers();
})();
</script>
</body>
</html>
