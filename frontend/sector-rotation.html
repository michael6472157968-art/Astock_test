<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>板块轮动热力图 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=15" />
<script src="/lib/echarts.js"></script>
<style>
.main-content { max-width: 100% !important; }
.page-title { font-size: 1.4rem !important; }
.page-desc { font-size: 0.88rem !important; }
.sector-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.source-tag { font-size: 0.82rem; padding: 3px 10px; border-radius: 4px; background: var(--color-border); color: var(--color-text-muted); }
</style>
</head>
<body>
<main class="main-content" data-chrome>
  <h2 class="page-title">板块轮动热力图</h2>
  <div class="sector-meta">
    <span class="page-desc" style="margin-bottom:0;font-size:0.88rem;">申万二级行业累计涨幅 · 灰色±0.5%定死 · 绿红渐变7段</span>
    <span style="font-size:0.82rem;color:var(--color-text-muted);" id="updateTime"></span>
  </div>

  <div id="sectorRotationChart" style="width:100%;">
    <div style="text-align:center;padding:60px;color:var(--color-text-muted);">加载中...</div>
  </div>
</main>

<script src="/js/app.js?v=18"></script>
<script>
(function() {
  function loadSectorRotation() {
    API.get('/sector-rotation/rotation?days=30').then(function(r) {
      var data = r.data || {};
      if (!data.sectors || !data.sectors.length || !data.cum_heatmap || !data.cum_heatmap.length) {
        document.getElementById('sectorRotationChart').innerHTML = '<div style="text-align:center;padding:60px;color:var(--color-text-muted);">暂无行业轮动数据，请先执行数据同步</div>';
        return;
      }
      renderSectorRotationChart(data);
    }).catch(function() {
      document.getElementById('sectorRotationChart').innerHTML = '<div style="text-align:center;padding:60px;color:var(--color-text-muted);">行业轮动数据加载失败</div>';
    });
  }

  function renderSectorRotationChart(data) {
    var container = document.getElementById('sectorRotationChart');
    if (!container) return;

    if (data.date) {
      document.getElementById('updateTime').textContent = '数据截止 ' + String(data.date).substring(0, 4) + '-' + String(data.date).substring(4, 6) + '-' + String(data.date).substring(6, 8);
    }

    var height = Math.max(500, data.sectors.length * 6 + 80);
    container.innerHTML = '<div id="cumHeatmap" style="width:100%;height:' + height + 'px;"></div>';
    var chartDom = document.getElementById('cumHeatmap');
    if (!chartDom) return;
    var chart = echarts.init(chartDom);
    var dates = data.dates.map(function(d) { return String(d).slice(4, 6) + '/' + String(d).slice(6, 8); });
    var sectorNames = data.sectors.map(function(s) { return s.name + '  ' + (s.cum > 0 ? '+' : '') + s.cum + '%'; });

    var option = {
      tooltip: {
        position: 'top',
        formatter: function(p) {
          var s = data.sectors[p.value[1]];
          return '<b>' + s.name + '</b><br/>' + data.dates[p.value[0]] + '：累计 ' + (p.value[2] > 0 ? '+' : '') + p.value[2] + '%<br/>当前累计：' + (s.cum > 0 ? '+' : '') + s.cum + '%';
        }
      },
      grid: { left: 120, right: 30, top: 10, bottom: 66 },
      xAxis: { type: 'category', data: dates, splitArea: { show: true }, axisLabel: { fontSize: 9, color: '#888' } },
      yAxis: { type: 'category', data: sectorNames, splitArea: { show: true }, axisLabel: { fontSize: 9, color: '#ccc' } },
      visualMap: {
        type: 'piecewise',
        pieces: [
          { min: 10, max: 100, label: '大涨', color: '#c62828' },
          { min: 3, max: 10, label: '涨', color: '#e53935' },
          { min: 0.5, max: 3, label: '微涨', color: '#ef5350' },
          { min: -0.5, max: 0.5, label: '平', color: '#616161' },
          { min: -3, max: -0.5, label: '微跌', color: '#66bb6a' },
          { min: -10, max: -3, label: '跌', color: '#43a047' },
          { min: -100, max: -10, label: '大跌', color: '#2e7d32' },
        ],
        orient: 'horizontal', left: 'center', bottom: 0,
        textStyle: { fontSize: 10, color: '#888' }
      },
      series: [{
        type: 'heatmap',
        data: data.cum_heatmap,
        label: { show: false },
        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } }
      }]
    };
    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
  }

  loadSectorRotation();
})();
</script>
</body>
</html>
