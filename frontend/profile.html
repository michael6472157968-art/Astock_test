<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人中心 - Stockwin</title>
<link rel="stylesheet" href="/css/app.css?v=14" />
</head>
<body>
<header class="app-header">
  <div class="header-left"><a href="/"><svg width="24" height="24" viewBox="0 0 24 24" style="display:block"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#00a8e8"/></linearGradient></defs><path d="M4,20 Q3,14 6,11 Q9,8 7,3" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round"/><polyline points="17,18 10,12 13,8 7,3" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-size:1.05rem;font-weight:700;background:linear-gradient(90deg,#00d4aa,#00a8e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Stock <span style="color:#8899aa;background:none;-webkit-text-fill-color:#8899aa">in</span></span></a></div>
  <nav id="topNav" class="header-nav"></nav>
</header>
<div class="risk-banner">⚠️ 免责声明：本平台所有分析内容仅供参考，不构成任何投资建议。股市有风险，投资需谨慎。</div>
<main class="main-content">
  <h2 class="page-title">个人中心</h2>
  <p class="page-desc" id="welcomeMsg">加载中...</p>

  <div class="profile-grid">
    <!-- 用户信息 + 积分 -->
    <div class="card"><div class="card-header">账户信息</div><div class="card-body" id="userInfoCard">
      <div class="state-loading">加载中...</div>
    </div></div>

    <!-- 积分信息 -->
    <div class="card"><div class="card-header">积分中心</div><div class="card-body" id="creditsCard">
      <div class="state-loading">加载中...</div>
    </div></div>

    <!-- 签到 -->
    <div class="card"><div class="card-header">每日签到</div><div class="card-body" id="checkinCard">
      <div class="state-loading">加载中...</div>
    </div></div>

    <!-- 会员状态 -->
    <div class="card"><div class="card-header">会员状态</div><div class="card-body" id="memberCard">
      <div class="state-loading">加载中...</div>
    </div></div>

    <!-- 激活码充值 -->
    <div class="card" id="activateCard"><div class="card-header">激活码充值</div><div class="card-body">
      <p style="font-size:0.85rem;color:var(--color-text-muted);margin-bottom:10px">输入激活码兑换会员，支持月卡(30天)和年卡(365天)</p>
      <div style="display:flex;gap:8px">
        <input class="form-input" id="activateCode" placeholder="输入8位激活码" maxlength="12" style="flex:1;font-family:monospace;letter-spacing:2px;text-transform:uppercase" />
        <button class="btn btn-primary" onclick="doActivate()">激活</button>
      </div>
      <p id="activateMsg" style="margin-top:8px;font-size:0.8rem"></p>
    </div></div>

    <!-- 移动端连接 -->
    <div class="card"><div class="card-header">移动端连接</div><div class="card-body" id="mobileCard">
      <p style="font-size:0.85rem;color:var(--color-text-muted);margin-bottom:12px">生成一次性连接码，在手机上打开浏览器输入即可登录</p>
      <button class="btn btn-outline" onclick="genConnection()">生成连接码</button>
      <div id="connectionResult" style="margin-top:12px"></div>
    </div></div>

    <!-- 管理员专区 -->
    <div class="card" id="adminGenCard" style="display:none"><div class="card-header">生成激活码（管理员）</div><div class="card-body">
      <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">类型</label>
          <select class="form-input" id="genCodeType" style="width:140px">
            <option value="monthly">月卡 (30天)</option>
            <option value="annual">年卡 (365天)</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">数量</label>
          <input class="form-input" id="genCodeCount" value="10" type="number" min="1" max="100" style="width:80px" />
        </div>
        <button class="btn btn-primary" onclick="genCodes()">生成激活码</button>
      </div>
      <div id="genResult" style="margin-top:12px;font-size:0.8rem"></div>
    </div></div>

    <!-- 管理员：缓存管理 -->
    <div class="card" id="adminCacheCard" style="display:none"><div class="card-header">缓存管理（管理员）</div><div class="card-body">
      <div class="stat-grid" style="margin-bottom:16px" id="cacheStats"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="refreshPool()">刷新选股池</button>
        <button class="btn btn-outline btn-sm" onclick="refreshRisk()">刷新风险扫描</button>
        <button class="btn btn-outline btn-sm" onclick="refreshSector()">刷新板块分析</button>
        <button class="btn btn-outline btn-sm" onclick="refreshReview()">刷新复盘</button>
        <button class="btn btn-outline btn-sm" onclick="syncData()">同步日线数据</button>
        <button class="btn btn-outline btn-sm" style="color:var(--color-danger);border-color:var(--color-danger)" onclick="clearAllCache()">清空缓存</button>
      </div>
      <p id="adminMsg" style="margin-top:8px;font-size:0.8rem"></p>
    </div></div>
  </div>
</main>
<footer class="app-footer">【风险提示】本平台所提供市场数据、技术分析、选股结果、诊股报告等内容仅供学习研究参考，不构成投资建议。投资者据此操作，风险自担。</footer>
<script src="/js/app.js?v=16"></script>
<script>
(function() {
  // 未登录跳转
  if (!Session.loggedIn()) {
    window.location.href = 'login.html?redirect=profile.html';
    return;
  }

  var isAdmin = Session.isAdmin();

  // 管理员显示专属卡片
  if (isAdmin) {
    document.getElementById('adminGenCard').style.display = '';
    document.getElementById('adminCacheCard').style.display = '';
    loadCacheStats();
  }

  // 加载用户信息
  loadProfile();

  // 会员已激活则隐藏激活卡
  if (Session.isVip()) {
    document.getElementById('activateCard').style.display = 'none';
  }

  function loadProfile() {
    API.get('/user/profile').then(function(r) {
      var d = r.data;
      document.getElementById('welcomeMsg').textContent = d.member_name + ' · ' + d.phone;

      // 用户信息卡片
      var avatarText = d.phone.replace(/\*/g, '').slice(-2);
      document.getElementById('userInfoCard').innerHTML =
        '<div style="display:flex;align-items:center;gap:16px">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700">' + avatarText + '</div>' +
        '<div><div style="font-weight:600;font-size:1.05rem">' + d.phone + '</div>' +
        '<div style="font-size:0.8rem;color:var(--color-text-muted)">注册于 ' + (d.created_at || '--').slice(0,10) + '</div></div>' +
        '</div>';

      // 积分卡片
      loadCredits(d.credits || 0);

      // 签到卡片
      loadCheckin();

      // 会员卡片
      var mcType = isAdmin ? 'admin' : d.member_type;
      var mcLabel = d.member_name;
      var remainHtml = '';
      if (d.remain_days !== null && d.remain_days !== undefined) {
        remainHtml = '<div class="mc-remain">剩余 <strong>' + d.remain_days + '</strong> 天</div>';
      } else {
        remainHtml = '<div class="mc-remain">未开通会员</div>';
      }
      var expireHtml = d.member_expire ? '<div class="mc-expire">到期日: ' + d.member_expire.slice(0,10) + '</div>' : '';
      document.getElementById('memberCard').innerHTML =
        '<div class="membership-card ' + mcType + '">' +
        '<div class="mc-title">当前等级</div>' +
        '<div class="mc-grade">' + mcLabel + '</div>' +
        remainHtml + expireHtml +
        '</div>';
    }).catch(function(e) {
      document.getElementById('welcomeMsg').textContent = '加载失败';
    });
  }

  // 积分余额 + 最近流水
  function loadCredits(currentCredits) {
    var card = document.getElementById('creditsCard');
    card.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
        '<div><div style="font-size:0.8rem;color:var(--color-text-muted)">积分余额</div>' +
        '<div style="font-size:2rem;font-weight:700;color:var(--color-primary)">' + currentCredits + '</div></div>' +
        '<a href="javascript:void(0)" onclick="loadLedger()" class="btn btn-sm btn-outline">查看流水</a>' +
      '</div>' +
      '<div id="ledgerArea"></div>';
  }

  function loadLedger() {
    var area = document.getElementById('ledgerArea');
    area.innerHTML = '<div class="state-loading" style="font-size:0.82rem">加载中...</div>';
    API.get('/credits/ledger?page=1&page_size=10').then(function(r) {
      var items = r.data.items || [];
      if (items.length === 0) {
        area.innerHTML = '<p class="state-empty">暂无积分变动记录</p>';
        return;
      }
      var html = '<table style="width:100%;font-size:0.78rem;border-collapse:collapse">' +
        '<thead><tr style="color:var(--color-text-muted);text-align:left">' +
        '<th>时间</th><th>说明</th><th style="text-align:right">金额</th><th style="text-align:right">余额</th>' +
        '</tr></thead><tbody>';
      items.forEach(function(item) {
        var cls = item.amount >= 0 ? 'color:var(--color-success)' : 'color:var(--color-danger)';
        var sign = item.amount >= 0 ? '+' : '';
        var ts = (item.created_at || '').replace('T', ' ').slice(0, 19);
        html += '<tr style="border-bottom:1px solid var(--color-border)">' +
          '<td style="padding:4px 0">' + ts + '</td>' +
          '<td>' + item.type_label + (item.note ? ' <span style="color:var(--color-text-muted)">' + escHtml2(item.note) + '</span>' : '') + '</td>' +
          '<td style="text-align:right;' + cls + '">' + sign + item.amount + '</td>' +
          '<td style="text-align:right">' + item.balance_after + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      area.innerHTML = html;
    }).catch(function(e) {
      area.innerHTML = '<p class="state-error">加载失败</p>';
    });
  }
  window.loadLedger = loadLedger;

  function escHtml2(v) {
    if (!v) return '';
    return v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 签到
  function loadCheckin() {
    var card = document.getElementById('checkinCard');
    API.get('/credits/checkin/status').then(function(r) {
      var d = r.data;
      var streak = d.streak || 0;
      var dates = d.checkin_dates || [];
      var checkedIn = d.checked_in_today;

      var cal = renderCheckinCalendar(dates, checkedIn, streak);
      var btnHtml = '';
      if (checkedIn) {
        var v = Session.isVip() ? 5 : 3;
        btnHtml = '<button class="btn btn-outline" disabled style="width:100%">✓ 今日已签到 (+' + d.today_credits + ')</button>';
        if (streak > 1) {
          btnHtml += '<p style="text-align:center;margin-top:4px;font-size:0.78rem;color:var(--color-text-muted)">连续签到 ' + streak + ' 天</p>';
        }
      } else {
        var label = '签到 +' + (Session.isVip() ? 5 : 3);
        btnHtml = '<button class="btn btn-primary" onclick="doCheckin()" style="width:100%">' + label + '</button>';
      }
      card.innerHTML = cal + btnHtml;
    }).catch(function() {
      card.innerHTML = '<p class="state-loading">加载失败</p>';
    });
  }

  function renderCheckinCalendar(dates, checkedIn, streak) {
    var today = new Date();
    var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-bottom:12px;font-size:0.75rem">';
    var days = ['一', '二', '三', '四', '五', '六', '日'];
    days.forEach(function(d) {
      html += '<span style="color:var(--color-text-muted)">' + d + '</span>';
    });
    // 最近28天日历
    var dateSet = {};
    dates.forEach(function(d) { dateSet[d] = true; });
    var start = new Date(today);
    start.setDate(start.getDate() - start.getDay() + 1 - 28); // 从4周前的周一开始
    var end = new Date(today);
    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      var ds = d.toISOString().slice(0, 10);
      var isToday = ds === today.toISOString().slice(0, 10);
      var has = dateSet[ds];
      var bg = has ? 'background:var(--color-primary);color:#fff;border-radius:4px;' : '';
      if (isToday && !has) bg = 'border:1px solid var(--color-primary);border-radius:4px;';
      html += '<span style="padding:2px 0;' + bg + '">' + d.getDate() + '</span>';
    }
    html += '</div>';
    // 下周连续奖励预告
    var nextStreak = streak + 1;
    if (checkedIn && nextStreak <= 7) {
      var bonusDays = 7 - nextStreak;
      var bonus = (Session.isVip() ? 10 : 8);
      html += '<p style="font-size:0.75rem;color:var(--color-text-muted);text-align:center">再签到 <strong>' +
        bonusDays + '</strong> 天可得额外 +5 积分 (共 +' + bonus + ')</p>';
    }
    return html;
  }

  function doCheckin() {
    var btn = document.querySelector('#checkinCard button');
    if (btn) { btn.disabled = true; btn.textContent = '签到中...'; }
    API.post('/credits/checkin').then(function(r) {
      var d = r.data;
      showToast('签到成功！+' + d.credits + ' 积分，连续 ' + d.streak + ' 天', 'success');
      loadCheckin();
      loadCredits(d.balance);
    }).catch(function(e) {
      showToast(e.message || '签到失败');
      if (e.message && e.message.indexOf('今日已签到') >= 0) loadCheckin();
    });
  }
  window.doCheckin = doCheckin;
})();

// 激活码兑换
function doActivate() {
  var code = document.getElementById('activateCode').value.trim();
  var msg = document.getElementById('activateMsg');
  if (!code) { msg.textContent = '请输入激活码'; msg.style.color = 'var(--color-danger)'; return; }
  msg.textContent = '激活中...'; msg.style.color = 'var(--color-text-muted)';
  API.post('/membership/activate', { code: code }).then(function(r) {
    Session.save(r.data);
    msg.textContent = '激活成功！当前等级: ' + r.data.member_name + '，剩余 ' + r.data.remain_days + ' 天';
    msg.style.color = 'var(--color-success)';
    showToast('会员激活成功！', 'success');
    setTimeout(function() { window.location.reload(); }, 1500);
  }).catch(function(e) {
    msg.textContent = e.message || '激活失败';
    msg.style.color = 'var(--color-danger)';
  });
}

// 生成连接码
function genConnection() {
  var el = document.getElementById('connectionResult');
  el.innerHTML = '<span style="color:var(--color-text-muted)">生成中...</span>';
  API.get('/user/connection').then(function(r) {
    el.innerHTML =
      '<div class="qr-box">' +
      '<div style="font-size:0.75rem;color:#64748b;margin-bottom:4px">在手机浏览器输入以下地址或连接码</div>' +
      '<div class="token-code">' + r.data.token + '</div>' +
      '<div style="font-size:0.72rem;color:#64748b;word-break:break-all;text-align:center">' + r.data.url + '</div>' +
      '<div style="font-size:0.7rem;color:#94a3b8">5分钟内有效</div>' +
      '</div>';
  }).catch(function(e) {
    el.innerHTML = '<span style="color:var(--color-danger)">生成失败: ' + (e.message || '') + '</span>';
  });
}

// 批量生成激活码
function genCodes() {
  var codeType = document.getElementById('genCodeType').value;
  var count = parseInt(document.getElementById('genCodeCount').value) || 10;
  var el = document.getElementById('genResult');
  el.innerHTML = '生成中...';
  API.post('/admin/membership/codes', { code_type: codeType, count: count }).then(function(r) {
    var codes = r.data.codes;
    var html = '<div style="font-weight:600;margin-bottom:8px">已生成 ' + codes.length + ' 个 ' + (codeType === 'monthly' ? '月卡' : '年卡') + ' 激活码：</div>';
    html += '<div style="max-height:200px;overflow-y:auto;background:var(--color-bg);padding:8px;border-radius:6px;font-family:monospace;font-size:0.82rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px">';
    codes.forEach(function(c) { html += '<span>' + c + '</span>'; });
    html += '</div>';
    html += '<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="navigator.clipboard.writeText(\'' + codes.join('\\n') + '\');showToast(\'已复制到剪贴板\',\'success\')">复制全部</button>';
    el.innerHTML = html;
  }).catch(function(e) {
    el.innerHTML = '<span style="color:var(--color-danger)">生成失败: ' + (e.message || '') + '</span>';
  });
}

// 管理员缓存操作
function loadCacheStats() {
  API.get('/admin/cache/stats').then(function(r) {
    document.getElementById('cacheStats').innerHTML =
      '<div class="stat-card"><div class="stat-label">缓存键数</div><div class="stat-value" style="font-size:1rem;">' + r.data.total_keys + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">永久缓存</div><div class="stat-value" style="font-size:1rem;">' + r.data.permanent + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">定时缓存</div><div class="stat-value" style="font-size:1rem;">' + r.data.with_ttl + '</div></div>';
  });
}
function adminMsg(text, ok) {
  var el = document.getElementById('adminMsg');
  el.textContent = text; el.style.color = ok ? 'var(--color-success)' : 'var(--color-danger)';
}

function refreshPool() { adminMsg('刷新中...'); API.post('/admin/cache/refresh/pool').then(function() { adminMsg('选股池已刷新', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
function refreshRisk() { adminMsg('扫描中...'); API.post('/admin/cache/refresh/risk').then(function() { adminMsg('风险已刷新', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
function refreshSector() { adminMsg('分析中...'); API.post('/admin/cache/refresh/sector').then(function() { adminMsg('板块已刷新', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
function refreshReview() { adminMsg('生成中...'); API.post('/admin/cache/refresh/review').then(function() { adminMsg('复盘已刷新', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
function syncData() { adminMsg('同步中(可能需要30秒)...'); API.post('/admin/tasks/run-daily-batch').then(function(r) { adminMsg('同步完成: ' + r.data.stock_synced + ' 股票, ' + r.data.daily_synced + ' 日线', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
function clearAllCache() { if (!confirm('确定清空全部缓存？')) return; API.post('/admin/cache/clear-all').then(function() { adminMsg('缓存已清空', true); loadCacheStats(); }).catch(function(e) { adminMsg(e.message); }); }
</script>
</body>
</html>
